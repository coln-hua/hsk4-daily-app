<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圆圆日记 - HSK4まいにち練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FBF2EE;
    --surface: #FFFFFF;
    --surface-2: #F6E4DC;
    --ink: #3A2E2A;
    --ink-soft: #9C8880;
    --accent: #4C8A6A;
    --accent-soft: #DEEEE2;
    --danger: #E0685A;
    --danger-soft: #FBE1DC;
    --celebrate: #E88CA0;
    --celebrate-soft: #FBE3E8;
    --border: #F0DDD3;
    --font-ui: ui-rounded, "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Hiragino Sans", sans-serif;
    --font-hanzi: "Songti SC", "Noto Serif SC", "Hiragino Serif", serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1613;
      --surface: #261E1B;
      --surface-2: #2F2521;
      --ink: #F1E6E0;
      --ink-soft: #B39D93;
      --accent: #6FC29B;
      --accent-soft: #22392E;
      --danger: #EB8A7C;
      --danger-soft: #3D241F;
      --celebrate: #F0A3B4;
      --celebrate-soft: #3D2530;
      --border: #3A2C26;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1613;
    --surface: #261E1B;
    --surface-2: #2F2521;
    --ink: #F1E6E0;
    --ink-soft: #B39D93;
    --accent: #6FC29B;
    --accent-soft: #22392E;
    --danger: #EB8A7C;
    --danger-soft: #3D241F;
    --celebrate: #F0A3B4;
    --celebrate-soft: #3D2530;
    --border: #3A2C26;
  }
  :root[data-theme="light"] {
    --bg: #FBF2EE;
    --surface: #FFFFFF;
    --surface-2: #F6E4DC;
    --ink: #3A2E2A;
    --ink-soft: #9C8880;
    --accent: #4C8A6A;
    --accent-soft: #DEEEE2;
    --danger: #E0685A;
    --danger-soft: #FBE1DC;
    --celebrate: #E88CA0;
    --celebrate-soft: #FBE3E8;
    --border: #F0DDD3;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 20px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @media (min-width: 500px) {
    body { background: var(--surface-2); }
    .shell {
      max-width: 560px;
      min-height: auto;
      margin: 48px auto;
      padding: 28px 32px 36px;
      background: var(--bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.28), 0 2px 10px rgba(0, 0, 0, 0.06);
    }
  }

  header.topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header.topbar h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header.topbar .sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .streak-chip {
    display: flex;
    align-items: baseline;
    gap: 4px;
    background: var(--celebrate-soft);
    color: var(--celebrate);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .streak-chip .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-tile .n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
  }
  .stat-tile .l {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .mode-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .mode-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .mode-card:active { transform: scale(0.98); }
  .mode-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .mode-card .glyph {
    font-family: var(--font-hanzi);
    font-size: 26px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    flex-shrink: 0;
  }
  .mode-card.review .glyph {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .mode-card.browse .glyph {
    background: var(--surface-2);
    color: var(--ink-soft);
  }
  .mode-card.tone .glyph {
    background: var(--celebrate-soft);
    color: var(--celebrate);
  }
  .mode-card .body { flex: 1; min-width: 0; }
  .mode-card .title { font-size: 15px; font-weight: 700; }
  .mode-card .desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .mode-card .badge {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .footnote {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.6;
    margin-top: auto;
    padding-top: 10px;
  }
  .text-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    font-size: 11px;
    cursor: pointer;
    padding: 6px 0;
    font-family: inherit;
  }
  .text-link:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

  /* session view */
  .session { display: none; flex-direction: column; gap: 16px; flex: 1; }
  .session.active { display: flex; }
  .home-view.hidden { display: none; }

  /* browse view */
  .browse-view { display: none; flex-direction: column; gap: 14px; flex: 1; }
  .browse-view.active { display: flex; }
  .browse-title { font-size: 16px; font-weight: 700; }
  .browse-tabs { display: flex; gap: 8px; }
  .browse-tab {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 12px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .browse-tab.active { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .browse-tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .browse-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .browse-panel[hidden] { display: none; }
  .browse-vocab-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  @media (min-width: 380px) { .browse-vocab-grid { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 500px) { .browse-vocab-grid { grid-template-columns: repeat(8, 1fr); } }
  @media (min-width: 700px) { .browse-vocab-grid { grid-template-columns: repeat(10, 1fr); } }
  .browse-num-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 9px 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    cursor: pointer;
  }
  .browse-num-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .browse-num-btn.done {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .browse-overall {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .browse-overall-bar {
    height: 8px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .browse-overall-fill {
    height: 100%;
    background: var(--celebrate);
    border-radius: 999px;
  }
  .browse-overall-label {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .set-progress {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 400;
  }
  .browse-set {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .browse-set summary {
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .browse-set summary::-webkit-details-marker { display: none; }
  .browse-set summary::after { content: "▾"; color: var(--ink-soft); font-weight: 400; }
  .browse-set[open] summary::after { content: "▴"; }
  .browse-set .browse-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    padding: 0 14px 14px;
  }
  @media (min-width: 380px) { .browse-set .browse-grid { grid-template-columns: repeat(7, 1fr); } }
  @media (min-width: 500px) { .browse-set .browse-grid { grid-template-columns: repeat(9, 1fr); } }
  @media (min-width: 700px) { .browse-set .browse-grid { grid-template-columns: repeat(11, 1fr); } }
  .browse-back-row { margin-top: 4px; }

  .session-head {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px 4px 0;
    line-height: 1;
  }
  .back-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .progress-count {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 260px;
    text-align: center;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hanzi-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .hanzi {
    font-family: var(--font-hanzi);
    font-size: 56px;
    line-height: 1.2;
    letter-spacing: 0.02em;
  }
  .mini-play-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mini-play-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reveal-hint {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .answer-block { display: none; flex-direction: column; gap: 10px; width: 100%; }
  .answer-block.show { display: flex; }
  .pinyin {
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--accent);
  }
  .meaning {
    font-size: 16px;
    color: var(--ink);
  }
  .en-line {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .en-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 3px;
  }
  .en-row .mini-play-btn.small { flex-shrink: 0; }
  .example-block {
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    text-align: left;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .example-block .ex-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .example-block .ex-zh {
    font-family: var(--font-hanzi);
    font-size: 16px;
    color: var(--ink);
  }
  .example-block .ex-pinyin {
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .mini-play-btn.small {
    width: 30px;
    height: 30px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .grade-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .grade-btn {
    display: none;
    border: none;
    border-radius: 14px;
    padding: 16px 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .grade-btn.show { display: block; }
  .grade-btn.wrong { background: var(--danger-soft); color: var(--danger); }
  .grade-btn.right { background: var(--accent-soft); color: var(--accent); }
  .grade-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .reason-row {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .reason-row.show { display: flex; }
  .reason-chip {
    border: 1px solid var(--danger);
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .reason-chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* listening */
  .item-tag {
    align-self: center;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px 10px;
    letter-spacing: 0.03em;
  }
  .listen-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .play-btn {
    align-self: center;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--surface);
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .play-btn.playing, .mini-play-btn.playing {
    background: var(--danger);
    color: var(--surface);
  }
  .listen-hint { text-align: center; font-size: 12px; color: var(--ink-soft); }
  .question-text { font-size: 15px; font-weight: 600; text-align: center; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .option-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option-btn.correct { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .option-btn.incorrect { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .option-btn[disabled] { cursor: default; }
  .transcript {
    display: none;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }
  .transcript.show { display: block; }
  .transcript .pinyin-line {
    display: block;
    margin-top: 6px;
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 12px;
  }
  .transcript .ja {
    display: block;
    margin-top: 6px;
    color: var(--ink);
    opacity: 0.85;
  }
  .next-btn {
    display: none;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
  }
  .next-btn.show { display: block; }
  .next-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* end of session */
  .done-view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .done-view.show { display: flex; }
  .done-view .big { font-size: 40px; }
  .done-view .msg { font-size: 15px; color: var(--ink-soft); }
  .home-btn {
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    background: var(--accent);
    color: var(--surface);
    cursor: pointer;
  }
  .home-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 20px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .lookup-popup {
    position: fixed;
    z-index: 50;
    transform: translate(-50%, -100%);
  }
  .lookup-popup[hidden] { display: none; }
  #lookupBtn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
  }
  #lookupBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="shell">

  <div class="home-view" id="homeView">
    <header class="topbar">
      <div>
        <h1>🐼 圆圆日记</h1>
        <div class="sub">今日もコツコツ、HSK4</div>
      </div>
      <div class="streak-chip"><span class="num" id="streakNum">0</span>日連続</div>
    </header>

    <div class="stat-row">
      <div class="stat-tile"><div class="n" id="statDue">0</div><div class="l">今日の予定</div></div>
      <div class="stat-tile"><div class="n" id="statReview">0</div><div class="l">苦手</div></div>
      <div class="stat-tile"><div class="n" id="statMastered">0</div><div class="l">習得済み</div></div>
    </div>

    <div class="mode-list">
      <button class="mode-card" onclick="startSession('vocab')">
        <div class="glyph">词</div>
        <div class="body">
          <div class="title">単語カード</div>
          <div class="desc">語彙を見て、意味を思い出す</div>
        </div>
        <div class="badge" id="badgeVocab">0</div>
      </button>
      <button class="mode-card" onclick="startSession('listening')">
        <div class="glyph">听</div>
        <div class="body">
          <div class="title">リスニング</div>
          <div class="desc">音声を聞いて、正解を選ぶ</div>
        </div>
        <div class="badge" id="badgeListening">0</div>
      </button>
      <button class="mode-card review" onclick="startSession('review')">
        <div class="glyph">错</div>
        <div class="body">
          <div class="title">苦手だけ復習</div>
          <div class="desc">間違えた問題だけをもう一度</div>

    {id:"v111",hanzi:"干",pinyin:"gàn",meaning:"する、やる",meaningEn:"to do",example:{zh:"你在干什么呢？",pinyin:"Nǐ zài gàn shénme ne?",ja:"何をしているの？",en:"What are you doing?"}},

    {id:"v113",hanzi:"厉害",pinyin:"lì hai",meaning:"すごい、激しい",meaningEn:"formidable, terrible, amazing",example:{zh:"他打篮球打得真厉害。",pinyin:"Tā dǎ lánqiú dǎ de zhēn lìhai.",ja:"彼はバスケがとても上手だ。",en:"He is really amazing at playing basketball."}},
    {id:"v114",hanzi:"拉",pinyin:"lā",meaning:"引く、手をつなぐ",meaningEn:"to pull; to hold (hands)",example:{zh:"那棵树特别粗，要四五个大人手拉手才能抱住。",pinyin:"Nà kē shù tèbié cū, yào sì wǔ ge dàrén shǒu lā shǒu cái néng bàozhù.",ja:"あの木はとても太くて、大人4、5人が手をつないでやっと抱えられる。",en:"That tree is so thick that it takes four or five adults holding hands to wrap around it."}},
    {id:"v115",hanzi:"圆",pinyin:"yuán",meaning:"丸い、円い",meaningEn:"round; circular",example:{zh:"今天晚上的月亮又大又圆，真漂亮。",pinyin:"Jīntiān wǎnshang de yuèliang yòu dà yòu yuán, zhēn piàoliang.",ja:"今夜の月は大きくて丸くて、とてもきれいだ。",en:"Tonight's moon is big and round, truly beautiful."}},
    {id:"v116",hanzi:"饺子",pinyin:"jiǎozi",meaning:"ギョーザ、水餃子",meaningEn:"dumpling (jiaozi)",example:{zh:"我最喜欢过年，全家人在一起包饺子，热闹极了。",pinyin:"Wǒ zuì xǐhuan guònián, quánjiā rén zài yìqǐ bāo jiǎozi, rènao jíle.",ja:"私は正月が一番好きだ、家族みんなで餃子を作って、とても賑やかだ。",en:"I love the Spring Festival most, the whole family makes dumplings together, it's so lively."}},

    {id:"v118",hanzi:"入口",pinyin:"rùkǒu",meaning:"入口",meaningEn:"entrance",example:{zh:"飞机还有40分钟就要起飞了，我现在在入口处，马上就到。",pinyin:"Fēijī hái yǒu sìshí fēnzhōng jiù yào qǐfēi le, wǒ xiànzài zài rùkǒu chù, mǎshàng jiù dào.",ja:"飛行機はあと40分で離陸する、私は今入口にいて、すぐ着く。",en:"The plane takes off in 40 minutes; I'm at the entrance now, I'll be there soon."}},

    {id:"v121",hanzi:"往往",pinyin:"wǎngwǎng",meaning:"往々にして、しばしば",meaningEn:"often; frequently",example:{zh:"人们常说：“最危险的地方往往也是最安全的地方。”",pinyin:"Rénmen cháng shuō: 'Zuì wēixiǎn de dìfang wǎngwǎng yěshì zuì ānquán de dìfang.'",ja:"人はよく「最も危険な場所は往々にして最も安全な場所でもある」と言う。",en:"People often say, 'The most dangerous place is often also the safest place.'"}},
    {id:"v122",hanzi:"出差",pinyin:"chūchāi",meaning:"出張する",meaningEn:"to go on a business trip",example:{zh:"我刚接到公司的通知，这周六得去北京出差，我们改天再见吧。",pinyin:"Wǒ gāng jiēdào gōngsī de tōngzhī, zhè zhōuliù děi qù Běijīng chūchāi, wǒmen gǎitiān zài jiàn ba.",ja:"会社から通知を受けたばかりで、今週土曜日は北京へ出張しなければならない、また今度会おう。",en:"I just got notice from the company that I have to go on a business trip to Beijing this Saturday; let's meet another day."}},
    {id:"v123",hanzi:"意见",pinyin:"yìjiàn",meaning:"意見",meaningEn:"opinion; suggestion",example:{zh:"小刘，你回去后把今天大家在会上提的意见都整理出来。",pinyin:"Xiǎo Liú, nǐ huíqu hòu bǎ jīntiān dàjiā zài huì shàng tí de yìjiàn dōu zhěnglǐ chūlái.",ja:"劉さん、戻ったら今日会議でみんなが出した意見をまとめてください。",en:"Xiao Liu, after you go back, please organize all the opinions everyone raised at today's meeting."}},

    {id:"v128",hanzi:"竟然",pinyin:"jìngrán",meaning:"意外にも、なんと",meaningEn:"unexpectedly; to one's surprise",example:{zh:"她一直都很重视这个机会，最后竟然放弃了，这让我们非常吃惊。",pinyin:"Tā yìzhí dōu hěn zhòngshì zhège jīhuì, zuìhòu jìngrán fàngqì le, zhè ràng wǒmen fēicháng chījīng.",ja:"彼女はずっとこのチャンスを重視していたのに、最後になんと諦めてしまい、私たちはとても驚いた。",en:"She had always valued this opportunity greatly, but in the end she unexpectedly gave it up, which surprised us a lot."}},

  var LISTENING = [
    {id:"l-41004-01",transcript:"很多妻子都希望自己的丈夫能记住他们结婚的日子，并且能在每年的这一天收到他送的礼物。",question:"妻子希望丈夫陪她逛街。",options:["对","错"],answer:1,transcriptJa:"多くの妻は、夫が二人の結婚記念日を覚えていて、毎年その日に贈り物をもらえることを望んでいる。",transcriptPinyin:"Hěn duō qīzi dōu xīwàng zìjǐ de zhàngfu néng jìzhu tāmen jiéhūn de rìzi, bìngqiě néng zài měi nián de zhè yì tiān shōudào tā sòng de lǐwù."},
    {id:"l-41004-02",transcript:"抱歉，这张表格您填得不对，请稍等一下，我再拿一张新的给您，请您重新填写一下。",question:"表格填写错了。",options:["对","错"],answer:0,transcriptJa:"申し訳ございません、こちらの用紙の記入に誤りがあります。少々お待ちください、新しい用紙をお持ちしますので、もう一度ご記入をお願いします。",transcriptPinyin:"Bàoqiàn, zhè zhāng biǎogé nín tián de bú duì, qǐng shāo děng yíxià, wǒ zài ná yì zhāng xīn de gěi nín, qǐng nín chóngxīn tiánxiě yíxià."},
    {id:"l-41004-03",transcript:"去面试的时候衣服要穿得正式一些，不能太随便，穿戴整齐表示你对面试者的尊重，会给他留下一个好的印象。",question:"面试时必须准时到。",options:["对","错"],answer:1,transcriptJa:"面接に行くときは服装をきちんと正式にすべきで、あまりカジュアルにしてはいけない。きちんとした服装は面接官への敬意を表し、良い印象を与える。",transcriptPinyin:"Qù miànshì de shíhou yīfu yào chuān de zhèngshì yìxiē, bù néng tài suíbiàn, chuāndài zhěngqí biǎoshì nǐ duì miànshìzhě de zūnzhòng, huì gěi tā liúxià yí ge hǎo de yìnxiàng."},
    {id:"l-41004-04",transcript:"出汗可以影响人的体温。大量运动后人会觉得很热，这时出汗可以使体温降低。相反，在寒冷的环境下，少出汗，可以留住体内的热量。",question:"多出汗对身体好。",options:["对","错"],answer:1,transcriptJa:"汗をかくことは体温に影響する。激しい運動をした後は暑く感じるが、このとき汗をかくことで体温を下げることができる。逆に寒い環境では、汗を少なくかくことで体内の熱を保つことができる。",transcriptPinyin:"Chūhàn kěyǐ yǐngxiǎng rén de tǐwēn. Dàliàng yùndòng hòu rén huì juéde hěn rè, zhè shí chūhàn kěyǐ shǐ tǐwēn jiàngdī. Xiāngfǎn, zài hánlěng de huánjìng xià, shǎo chūhàn, kěyǐ liúzhù tǐnèi de rèliàng."},
    {id:"l-41004-05",transcript:"狗是很聪明的动物，但要让它完成一些任务，只教一次是不可能让它马上就记住的，应该耐心地一遍一遍地教给它，使它熟悉，然后才能学会。",question:"教狗学习需要耐心。",options:["对","错"],answer:0,transcriptJa:"犬はとても賢い動物だが、何かの作業を覚えさせるには、一度教えただけではすぐに覚えさせることはできない。根気強く何度も教えて慣れさせて、それから初めて覚えられるのだ。",transcriptPinyin:"Gǒu shì hěn cōngmíng de dòngwù, dàn yào ràng tā wánchéng yìxiē rènwu, zhǐ jiāo yí cì shì bù kěnéng ràng tā mǎshàng jiù jìzhu de, yīnggāi nàixīn de yíbiàn yíbiàn de jiāo gěi tā, shǐ tā shúxī, ránhòu cáinéng xuéhuì."},
    {id:"l-41004-06",transcript:"到机场后，他才发现忘记带信用卡了，他乘坐的航班大约半小时后就要起飞了，他只好改签下一趟航班。",question:"他没带护照。",options:["对","错"],answer:1,transcriptJa:"空港に着いてから、彼はクレジットカードを忘れてきたことに気づいた。彼が乗る便はあと30分ほどで出発するため、彼は仕方なく次の便に変更した。",transcriptPinyin:"Dào jīchǎng hòu, tā cái fāxiàn wàngjì dài xìnyòngkǎ le, tā chéngzuò de hángbān dàyuē bàn xiǎoshí hòu jiù yào qǐfēi le, tā zhǐhǎo gǎiqiān xià yí tàng hángbān."},
    {id:"l-41004-07",transcript:"现在朋友之间流行发各种幽默短信，这给我们的生活带来一些快乐。但是如果同样的短信你收到了三四遍，再幽默的短信你也笑不出来了。",question:"发短信很麻烦。",options:["对","错"],answer:1,transcriptJa:"最近友人同士でいろいろなユーモラスなショートメッセージを送り合うのが流行っていて、私たちの生活に楽しさをもたらしている。しかし同じメッセージを3、4回も受け取ると、どんなに面白いメッセージでも笑えなくなる。",transcriptPinyin:"Xiànzài péngyou zhījiān liúxíng fā gèzhǒng yōumò duǎnxìn, zhè gěi wǒmen de shēnghuó dàilái yìxiē kuàilè. Dànshì rúguǒ tóngyàng de duǎnxìn nǐ shōudào le sān sì biàn, zài yōumò de duǎnxìn nǐ yě xiào bù chūlái le."},
    {id:"l-41004-08",transcript:"舞会上最好不要直接拒绝别人的邀请，如果不得不拒绝，可以告诉他：“我有些累了，想休息一下。”之后也不要很快又接受其他人的邀请。",question:"不要直接拒绝邀请。",options:["对","错"],answer:0,transcriptJa:"ダンスパーティーでは、人からの誘いを直接断らない方がよい。もしどうしても断らなければならない場合は、「少し疲れたので休みたいです」と伝えるとよい。その後すぐに他の人の誘いを受けるのも避けた方がよい。",transcriptPinyin:"Wǔhuì shàng zuìhǎo bú yào zhíjiē jùjué biéren de yāoqǐng, rúguǒ bùdébù jùjué, kěyǐ gàosu tā: \"Wǒ yǒuxiē lèi le, xiǎng xiūxi yíxià.\" Zhīhòu yě bú yào hěn kuài yòu jiēshòu qítā rén de yāoqǐng."},
    {id:"l-41004-09",transcript:"太阳对我们的影响实在是太大了，它每天为地球提供阳光和热量，保证动植物在合适温度下正常生长，这种情况在将来至少四十亿年不会改变。",question:"太阳对大自然的影响很大。",options:["对","错"],answer:0,transcriptJa:"太陽が私たちに与える影響は本当に大きい。太陽は毎日地球に日光と熱を提供し、動植物が適した温度で正常に成長することを保証している。この状況は今後少なくとも40億年は変わらないだろう。",transcriptPinyin:"Tàiyáng duì wǒmen de yǐngxiǎng shízài shì tài dà le, tā měitiān wèi dìqiú tígōng yángguāng hé rèliàng, bǎozhèng dòng zhíwù zài héshì wēndù xià zhèngcháng shēngzhǎng, zhè zhǒng qíngkuàng zài jiānglái zhìshǎo sìshí yì nián bú huì gǎibiàn."},
    {id:"l-41004-10",transcript:"春天天气忽冷忽热，容易感冒，医生提醒人们要注意室内空气质量，早上起床后应该打开窗户换换空气。如果感冒了，要及时去医院。",question:"春天容易感冒。",options:["对","错"],answer:0,transcriptJa:"春は気温が急に寒くなったり暖かくなったりして、風邪を引きやすい。医者は、室内の空気の質に注意し、朝起きたら窓を開けて空気を入れ替えるよう呼びかけている。もし風邪を引いたら、すぐに病院に行くべきだ。",transcriptPinyin:"Chūntiān tiānqì hū lěng hū rè, róngyì gǎnmào, yīshēng tíxǐng rénmen yào zhùyì shìnèi kōngqì zhìliàng, zǎoshang qǐchuáng hòu yīnggāi dǎkāi chuānghu huànhuan kōngqì. Rúguǒ gǎnmào le, yào jíshí qù yīyuàn."},
    {id:"l-41004-11",transcript:"男：今天吃得太多了，肚子有点儿不舒服。\n女：喝点儿热茶可能会好一些。",question:"男的怎么了？",options:["想喝茶","啤酒喝多了","肚子不舒服","不想去医院"],answer:2,transcriptJa:"男：今日は食べ過ぎて、お腹が少し調子悪い。\n女：温かいお茶を少し飲むと楽になるかもしれないよ。",transcriptPinyin:"男：Jīntiān chī de tài duō le, dùzi yǒudiǎnr bù shūfu.\n女：Hē diǎnr rè chá kěnéng huì hǎo yìxiē."},
    {id:"l-41004-12",transcript:"女：都九点了，你怎么还在睡懒觉？快起床吧。\n男：昨晚看网球比赛看到两点半，这不周六吗，平时哪能睡到九点？",question:"根据对话，可以知道什么？",options:["昨晚有比赛","比赛推迟了","男的很紧张","女的是记者"],answer:0,transcriptJa:"女：もう9時なのに、まだ寝坊してるの？早く起きて。\n男：昨夜テニスの試合を2時半まで見てたんだ。今日は土曜日じゃないか、普段は9時まで寝られないよ。",transcriptPinyin:"女：Dōu jiǔ diǎn le, nǐ zěnme hái zài shuì lǎnjiào? Kuài qǐchuáng ba.\n男：Zuówǎn kàn wǎngqiú bǐsài kàn dào liǎng diǎn bàn, zhè bú zhōuliù ma, píngshí nǎ néng shuì dào jiǔ diǎn?"},
    {id:"l-41004-13",transcript:"男：这件事让小刘负责怎么样？\n女：我觉得挺合适的，他就是学这个专业的，做事情也很仔细。",question:"女的觉得小刘怎么样？",options:["长得很帅","需要鼓励","不太成熟","符合要求"],answer:3,transcriptJa:"男：この件は劉くんに任せたらどうかな？\n女：それはぴったりだと思う。彼はまさにこの専門を学んでいたし、仕事も丁寧だから。",transcriptPinyin:"男：Zhè jiàn shì ràng Xiǎo Liú fùzé zěnmeyàng?\n女：Wǒ juéde tǐng héshì de, tā jiùshì xué zhège zhuānyè de, zuò shìqing yě hěn zǐxì."},
    {id:"l-41004-14",transcript:"女：那位导游给我的感觉很不错，这几天我们玩得很愉快。\n男：同意，她的服务态度确实挺好，我们真应该好好谢谢她。",question:"他们打算感谢谁？",options:["警察","导游","服务员","售货员"],answer:1,transcriptJa:"女：あのガイドさん、すごく感じが良かったよね。ここ数日、楽しく過ごせた。\n男：同感だよ。彼女の対応は本当に良かった。ちゃんとお礼を言うべきだね。",transcriptPinyin:"女：Nà wèi dǎoyóu gěi wǒ de gǎnjué hěn búcuò, zhè jǐ tiān wǒmen wán de hěn yúkuài.\n男：Tóngyì, tā de fúwù tàidu quèshí tǐng hǎo, wǒmen zhēn yīnggāi hǎohǎo xièxie tā."},
    {id:"l-41004-15",transcript:"男：小姐，您好，您想买什么家具？需要我为您介绍一下吗？\n女：谢谢，我想买沙发，有蓝色的吗？",question:"女的要买什么？",options:["沙发","空调","眼镜","袜子"],answer:0,transcriptJa:"男：いらっしゃいませ。どんな家具をお求めですか？ご案内しましょうか？\n女：ありがとう、ソファを買いたいのですが、青色のものはありますか？",transcriptPinyin:"男：Xiǎojiě, nín hǎo, nín xiǎng mǎi shénme jiājù? Xūyào wǒ wèi nín jièshào yíxià ma?\n女：Xièxie, wǒ xiǎng mǎi shāfā, yǒu lánsè de ma?"},
    {id:"l-41004-16",transcript:"女：真对不起，把您吵醒了。\n男：别客气，我正好也要起来活动活动了。",question:"男的刚才最可能在做什么？",options:["睡觉","看电视","弹钢琴","阅读杂志"],answer:0,transcriptJa:"女：本当にごめんなさい、起こしてしまって。\n男：気にしないで、ちょうど起きて体を動かそうと思っていたところだから。",transcriptPinyin:"女：Zhēn duìbuqǐ, bǎ nín chǎoxǐng le.\n男：Bié kèqi, wǒ zhènghǎo yě yào qǐlái huódòng huódòng le."},
    {id:"l-41004-17",transcript:"男：奇怪，你忘记放糖了吗？这杯咖啡怎么这么苦？\n女：你的在那儿呢，这杯是我的，我的没放糖。",question:"他们在谈什么？",options:["蛋糕","果汁","饼干","咖啡"],answer:3,transcriptJa:"男：おかしいな、砂糖を入れ忘れた？このコーヒー、なんでこんなに苦いんだ？\n女：あなたのはあそこにあるよ。これは私のだから、私のは砂糖を入れてないの。",transcriptPinyin:"男：Qíguài, nǐ wàngjì fàng táng le ma? Zhè bēi kāfēi zěnme zhème kǔ?\n女：Nǐ de zài nàr ne, zhè bēi shì wǒ de, wǒ de méi fàng táng."},
    {id:"l-41004-18",transcript:"女：喂，你中午几点到？我请个假去火车站接你。\n男：不用专门来接我，我行李很少，你放心吧，家里见。",question:"男的是什么意思？",options:["不用来接","想提前回家","还有个约会","路上堵车了"],answer:0,transcriptJa:"女：もしもし、お昼何時に着くの？休みを取って駅まで迎えに行くよ。\n男：わざわざ迎えに来なくていいよ、荷物も少ないし。安心して、家で会おう。",transcriptPinyin:"女：Wéi, nǐ zhōngwǔ jǐ diǎn dào? Wǒ qǐng ge jià qù huǒchēzhàn jiē nǐ.\n男：Bú yòng zhuānmén lái jiē wǒ, wǒ xíngli hěn shǎo, nǐ fàngxīn ba, jiā lǐ jiàn."},
    {id:"l-41004-19",transcript:"男：晚上有什么安排吗？跟我们去游泳吧。\n女：不了，我爸今天过生日，家里来了一些亲戚，我得回去帮忙。",question:"今天是谁过生日？",options:["女儿","父亲","爷爷","奶奶"],answer:1,transcriptJa:"男：今夜は何か予定ある？一緒に泳ぎに行こうよ。\n女：やめておくわ。今日は父の誕生日で、家に親戚が来ているの。手伝いに帰らないと。",transcriptPinyin:"男：Wǎnshang yǒu shénme ānpái ma? Gēn wǒmen qù yóuyǒng ba.\n女：Bù le, wǒ bà jīntiān guò shēngrì, jiā lǐ lái le yìxiē qīnqi, wǒ děi huíqù bāngmáng."},
    {id:"l-41004-20",transcript:"女：我今天做的酸菜鱼怎么样？你尝了吗？\n男：还可以，鱼肉很鲜，如果汤里再加一点儿盐就更好了。",question:"男的觉得鱼怎么样？",options:["比较咸","太辣了","不太新鲜","盐放少了"],answer:3,transcriptJa:"女：今日作った酸菜魚（サンツァイユー）はどう？食べてみた？\n男：まあまあだね、魚の身は新鮮だよ。スープにもう少し塩を足すともっと良くなると思う。",transcriptPinyin:"女：Wǒ jīntiān zuò de suāncàiyú zěnmeyàng? Nǐ cháng le ma?\n男：Hái kěyǐ, yúròu hěn xiān, rúguǒ tāng lǐ zài jiā yìdiǎnr yán jiù gèng hǎo le."},
    {id:"l-41004-21",transcript:"男：你现在在哪儿呢？找时间把咱们在公园照的照片发给我？\n女：抱歉，照相机刚被我妹借走了，暂时发不了，明天一定发给你。",question:"女的为什么现在不能发照片？",options:["生病了","相机借走了","正在收拾家","怕打扰男的"],answer:1,transcriptJa:"男：今どこにいるの？時間があるとき、公園で撮った写真を送ってくれる？\n女：ごめん、カメラをさっき妹に借りられちゃって、今は送れないの。明日必ず送るね。",transcriptPinyin:"男：Nǐ xiànzài zài nǎr ne? Zhǎo shíjiān bǎ zánmen zài gōngyuán zhào de zhàopiàn fā gěi wǒ?\n女：Bàoqiàn, zhàoxiàngjī gāng bèi wǒ mèi jièzǒu le, zànshí fā bùliǎo, míngtiān yídìng fā gěi nǐ."},
    {id:"l-41004-22",transcript:"女：你这条裤子脏死了，一起扔洗衣机里洗洗吧。\n男：等一下！口袋里还有两张电影票。",question:"他们俩最可能是什么关系？",options:["邻居","夫妻","司机和乘客","大夫和护士"],answer:1,transcriptJa:"女：あなたのこのズボン、すごく汚れてるね、洗濯機に入れて洗おう。\n男：ちょっと待って！ポケットに映画のチケットが2枚入ってる。",transcriptPinyin:"女：Nǐ zhè tiáo kùzi zāng sǐ le, yìqǐ rēng xǐyījī lǐ xǐxi ba.\n男：Děng yíxià! Kǒudài lǐ hái yǒu liǎng zhāng diànyǐngpiào."},
    {id:"l-41004-23",transcript:"男：这张画儿挂这儿可以吗？\n女：这儿地方太小，有点儿窄，还是挂对面的墙上吧。",question:"女的是什么意见？",options:["挂张地图","注意节约","挂对面墙上","抬进厨房里"],answer:2,transcriptJa:"男：この絵、ここに掛けてもいい？\n女：ここは場所が小さくて、ちょっと狭いから、向かいの壁に掛けたほうがいいよ。",transcriptPinyin:"男：Zhè zhāng huàr guà zhèr kěyǐ ma?\n女：Zhèr dìfang tài xiǎo, yǒudiǎnr zhǎi, háishi guà duìmiàn de qiáng shàng ba."},
    {id:"l-41004-24",transcript:"女：马上就要毕业了，你准备在学校附近租房子吗？\n男：学校附近太贵。离学校远点儿没关系，只要离地铁或者公交车站近就行。",question:"男的对房子有什么要求？",options:["楼层好","购物方便","交通方便","周围热闹"],answer:2,transcriptJa:"女：もうすぐ卒業だけど、学校の近くで部屋を借りるつもり？\n男：学校の近くは高すぎるよ。学校から少し遠くても構わない、地下鉄やバス停に近ければいいんだ。",transcriptPinyin:"女：Mǎshàng jiù yào bìyè le, nǐ zhǔnbèi zài xuéxiào fùjìn zū fángzi ma?\n男：Xuéxiào fùjìn tài guì. Lí xuéxiào yuǎn diǎnr méi guānxi, zhǐyào lí dìtiě huòzhě gōngjiāo chēzhàn jìn jiù xíng."},
    {id:"l-41004-25",transcript:"男：去长城玩儿的同事，请明天到公司集合，九点出发，一共是十二位同事。现在还有人要报名吗？\n女：明天我们参观多长时间？大概几点能回来？",question:"女的关心什么？",options:["见面的地点","回来的时间","工资和奖金","公司的规定"],answer:1,transcriptJa:"男：万里の長城へ行く同僚は、明日会社に集合してください。9時出発で、合計12名の同僚です。今、参加を申し込みたい人はいますか？\n女：明日の見学はどのくらいの時間かかりますか？だいたい何時ごろ戻れますか？",transcriptPinyin:"男：Qù Chángchéng wánr de tóngshì, qǐng míngtiān dào gōngsī jíhé, jiǔ diǎn chūfā, yígòng shì shí'èr wèi tóngshì. Xiànzài hái yǒu rén yào bàomíng ma?\n女：Míngtiān wǒmen cānguān duō cháng shíjiān? Dàgài jǐ diǎn néng huílái?"},
    {id:"l-41004-26",transcript:"女：好久不见，最近在忙什么呢？\n男：我在办签证，准备出国。\n女：你的生意不是做得很顺利吗？怎么突然想出国留学了？\n男：你误会了，我是去旅游。",question:"男的为什么要出国？",options:["读博士","去旅游","谈生意","学法律"],answer:1,transcriptJa:"女：お久しぶり、最近何を忙しくしてるの？\n男：ビザの手続きをしていて、出国する準備をしているんだ。\n女：あなたの仕事は順調じゃなかったの？どうして急に留学しようと思ったの？\n男：誤解だよ、旅行に行くんだ。",transcriptPinyin:"女：Hǎojiǔ bú jiàn, zuìjìn zài máng shénme ne?\n男：Wǒ zài bàn qiānzhèng, zhǔnbèi chūguó.\n女：Nǐ de shēngyi bú shì zuò de hěn shùnlì ma? Zěnme tūrán xiǎng chūguó liúxué le?\n男：Nǐ wùhuì le, wǒ shì qù lǚyóu."},
    {id:"l-41004-27",transcript:"男：你穿这件衣服看起来又高又瘦，很漂亮。\n女：真的啊？太好了，你说我穿哪个颜色更好呢？\n男：你穿这个黄色的就行，不过白的也不错。\n女：那我再试试白的，两个比较一下。",question:"女的是什么意思？",options:["她变胖了","不能打折","想买衬衫","再试试白的"],answer:3,transcriptJa:"男：この服を着ると背が高くてスリムに見えて、きれいだよ。\n女：本当？よかった、どの色のほうがいいと思う？\n男：この黄色のでいいと思うけど、白いのも悪くないよ。\n女：じゃあもう一度白いのを試してみて、二つを比べてみるわ。",transcriptPinyin:"男：Nǐ chuān zhè jiàn yīfu kànqǐlái yòu gāo yòu shòu, hěn piàoliang.\n女：Zhēn de a? Tài hǎo le, nǐ shuō wǒ chuān nǎge yánsè gèng hǎo ne?\n男：Nǐ chuān zhège huángsè de jiù xíng, búguò bái de yě búcuò.\n女：Nà wǒ zài shìshi bái de, liǎng ge bǐjiào yíxià."},
    {id:"l-41004-28",transcript:"女：听说你大学二年级的时候就开始在广告公司工作了。\n男：是的，这让我积累了较为丰富的工作经验。\n女：这样做不会影响你的学习吗？\n男：我认为不会，实际工作能让我更理解书本上的知识。",question:"男的对参加工作怎么看？",options:["收入高","压力大","能积累经验","会影响学习"],answer:2,transcriptJa:"女：大学2年生のときからもう広告会社で働いていたと聞いたけど。\n男：そうだよ、おかげで比較的豊富な仕事の経験を積むことができた。\n女：それで勉強に影響しない？\n男：影響しないと思うよ、実際の仕事のおかげで教科書の知識をより理解できるんだ。",transcriptPinyin:"女：Tīngshuō nǐ dàxué èr niánjí de shíhou jiù kāishǐ zài guǎnggào gōngsī gōngzuò le.\n男：Shì de, zhè ràng wǒ jīlěi le jiàowéi fēngfù de gōngzuò jīngyàn.\n女：Zhèyàng zuò bú huì yǐngxiǎng nǐ de xuéxí ma?\n男：Wǒ rènwéi bú huì, shíjì gōngzuò néng ràng wǒ gèng lǐjiě shūběn shàng de zhīshi."},
    {id:"l-41004-29",transcript:"男：你研究生考试考得怎么样？\n女：数学可能考得不太理想。\n男：大家都觉得题挺难的。你复习那么长时间了，肯定没问题。\n女：谢谢！五号成绩就出来了，到时候就知道了。",question:"成绩什么时候出来？",options:["5号","15号","星期五","星期日"],answer:0,transcriptJa:"男：大学院の試験はどうだった？\n女：数学はあまり理想的にできなかったかも。\n男：みんな問題がかなり難しかったと言っているよ。あんなに長く復習したんだから、きっと大丈夫だよ。\n女：ありがとう！5日には結果が出るから、そのときにわかるね。",transcriptPinyin:"男：Nǐ yánjiūshēng kǎoshì kǎo de zěnmeyàng?\n女：Shùxué kěnéng kǎo de bú tài lǐxiǎng.\n男：Dàjiā dōu juéde tí tǐng nán de. Nǐ fùxí nàme cháng shíjiān le, kěndìng méi wèntí.\n女：Xièxie! Wǔ hào chéngjì jiù chūlái le, dào shíhou jiù zhīdao le."},
    {id:"l-41004-30",transcript:"女：先生您好，您的座位在这儿。\n男：谢谢。请把菜单给我。\n女：给您，这个是今天的特价菜。\n男：我不吃羊肉，我先看看其他的菜吧。",question:"关于男的，可以知道什么？",options:["口渴了","迟到了","爱开玩笑","不吃羊肉"],answer:3,transcriptJa:"女：いらっしゃいませ、お客様のお席はこちらです。\n男：ありがとう。メニューをください。\n女：どうぞ、これは本日の特価メニューです。\n男：私は羊肉を食べないので、まず他の料理を見てみます。",transcriptPinyin:"女：Xiānsheng nín hǎo, nín de zuòwèi zài zhèr.\n男：Xièxie. Qǐng bǎ càidān gěi wǒ.\n女：Gěi nín, zhège shì jīntiān de tèjiàcài.\n男：Wǒ bù chī yángròu, wǒ xiān kànkan qítā de cài ba."},
    {id:"l-41004-31",transcript:"男：你不是两点就出发了？难道路上花了两个多小时？\n女：我半路上跟另一辆车撞了，刚才把车送去修了。\n男：撞得严重吗？你怎么那么不小心！\n女：没事，不严重，就是把车门擦坏了。但恐怕一星期都不能开车了。",question:"关于女的，可以知道什么？",options:["撞车了","超速了","发烧了","住院了"],answer:0,transcriptJa:"男：2時にはもう出発したんじゃないの？まさか道中で2時間以上かかったの？\n女：途中で別の車とぶつかったの、さっき修理に出してきたところ。\n男：ひどくぶつかったの？なんでそんなに不注意なんだ！\n女：大丈夫、ひどくはないよ、ドアを擦って傷つけただけ。でも1週間は運転できないかもしれない。",transcriptPinyin:"男：Nǐ bú shì liǎng diǎn jiù chūfā le? Nándào lùshang huā le liǎng ge duō xiǎoshí?\n女：Wǒ bàn lùshang gēn lìng yí liàng chē zhuàng le, gāngcái bǎ chē sòngqù xiū le.\n男：Zhuàng de yánzhòng ma? Nǐ zěnme nàme bù xiǎoxīn!\n女：Méishì, bù yánzhòng, jiùshì bǎ chēmén cāhuài le. Dàn kǒngpà yì xīngqī dōu bù néng kāichē le."},
    {id:"l-41004-32",transcript:"女：海洋公园到底是不是在东边啊？怎么还没到？\n男：方向肯定没错，估计再有几分钟就到了吧。\n女：再晚了我们就来不及看表演了。\n男：别担心，下午还有一场呢。",question:"女的现在心情怎么样？",options:["得意","紧张","吃惊","着急"],answer:3,transcriptJa:"女：海洋公園って本当に東にあるの？どうしてまだ着かないの？\n男：方向は間違いないはずだよ、あと数分で着くと思う。\n女：これ以上遅くなったらショーに間に合わなくなる。\n男：心配しないで、午後にもう一回あるから。",transcriptPinyin:"女：Hǎiyáng gōngyuán dàodǐ shì bú shì zài dōngbian a? Zěnme hái méi dào?\n男：Fāngxiàng kěndìng méi cuò, gūjì zài yǒu jǐ fēnzhōng jiù dào le ba.\n女：Zài wǎn le wǒmen jiù láibují kàn biǎoyǎn le.\n男：Bié dānxīn, xiàwǔ hái yǒu yì chǎng ne."},
    {id:"l-41004-33",transcript:"男：今天是小王请客？他有什么高兴事儿呀？\n女：他搬新家了，晚上请老同学们去家里吃饭，顺便看看他的新房子。\n男：是吗？他在哪儿买的房子？\n女：他那儿的名字好像是“长江花园”，环境很好，很安静。",question:"小王怎么了？",options:["去打针了","买了台电脑","买新房子了","写错地址了"],answer:2,transcriptJa:"男：今日は王さんのおごりなの？何かいいことでもあったの？\n女：彼、新しい家に引っ越したの。今晩昔の同級生たちを家に招いて食事をするそうよ、ついでに新しい家も見せてもらうの。\n男：そうなんだ？どこで家を買ったの？\n女：たしか「長江花園」という名前の場所らしいよ、環境がとても良くて静かなところ。",transcriptPinyin:"男：Jīntiān shì Xiǎo Wáng qǐngkè? Tā yǒu shénme gāoxìng shìr ya?\n女：Tā bān xīn jiā le, wǎnshang qǐng lǎo tóngxuémen qù jiā lǐ chīfàn, shùnbiàn kànkan tā de xīn fángzi.\n男：Shì ma? Tā zài nǎr mǎi de fángzi?\n女：Tā nàr de míngzi hǎoxiàng shì \"Chángjiāng Huāyuán\", huánjìng hěn hǎo, hěn ānjìng."},
    {id:"l-41004-34",transcript:"女：明天的演唱会你要不要看？\n男：我当然想去，可惜票早就卖光了。\n女：正好我朋友多给了我一张，那到时候一起去吧。\n男：真的假的？你是在开玩笑骗我吧？\n女：怎么会呢？明晚七点南门见。",question:"明天晚上他们在哪儿见面？",options:["南门","西门","教室","图书馆旁边"],answer:0,transcriptJa:"女：明日のコンサート、見に行きたい？\n男：もちろん行きたいよ、でも残念ながらチケットはもう売り切れてしまった。\n女：ちょうど友達が余分に1枚くれたの、じゃあ一緒に行こうよ。\n男：本当？冗談で騙してるんじゃない？\n女：そんなわけないでしょ？明日の夜7時に南門で会おう。",transcriptPinyin:"女：Míngtiān de yǎnchànghuì nǐ yào bú yào kàn?\n男：Wǒ dāngrán xiǎng qù, kěxī piào zǎo jiù mài guāng le.\n女：Zhènghǎo wǒ péngyou duō gěi le wǒ yì zhāng, nà dào shíhou yìqǐ qù ba.\n男：Zhēn de jiǎ de? Nǐ shì zài kāiwánxiào piàn wǒ ba?\n女：Zěnme huì ne? Míngwǎn qī diǎn nánmén jiàn."},
    {id:"l-41004-35",transcript:"男：这些塑料盒子还有用吗？\n女：没用了。\n男：没用的东西就放垃圾桶里，别到处乱扔。\n女：好吧，那我现在把房间整理一下。",question:"女的是什么态度？",options:["同意","原谅","太麻烦","十分满意"],answer:0,transcriptJa:"男：このプラスチックの箱、まだ使うの？\n女：もう使わないよ。\n男：使わないものはゴミ箱に入れて、あちこちに散らかさないで。\n女：わかった、じゃあ今から部屋を片付けるわ。",transcriptPinyin:"男：Zhèxiē sùliào hézi hái yǒu yòng ma?\n女：Méi yòng le.\n男：Méi yòng de dōngxi jiù fàng lājītǒng lǐ, bié dàochù luàn rēng.\n女：Hǎo ba, nà wǒ xiànzài bǎ fángjiān zhěnglǐ yíxià."},
    {id:"l-41004-36",transcript:"北方人爱吃饺子，除了因为饺子味道鲜美，还因为人们忙了一年，过年时全家人坐在一起包饺子，是很好的交流机会。另外，还跟北方的气候有关，北方比南方寒冷，吃热饺子让人感觉很暖和、很舒服。",question:"北方人过年有什么习惯？",options:["爬山","理发","吃饺子","吃面条"],answer:2,transcriptJa:"北方の人は餃子が好きだ。それは餃子の味が美味しいからだけでなく、一年間忙しく働いた人々が、正月に家族全員で座って餃子を包むことが、良い交流の機会になるからでもある。また、北方の気候とも関係がある。北方は南方より寒く、熱い餃子を食べると体が温まり、とても心地よく感じられるのだ。",transcriptPinyin:"Běifāng rén ài chī jiǎozi, chúle yīnwèi jiǎozi wèidao xiānměi, hái yīnwèi rénmen máng le yì nián, guònián shí quánjiā rén zuò zài yìqǐ bāo jiǎozi, shì hěn hǎo de jiāoliú jīhuì. Lìngwài, hái gēn běifāng de qìhòu yǒuguān, běifāng bǐ nánfāng hánlěng, chī rè jiǎozi ràng rén gǎnjué hěn nuǎnhuo, hěn shūfu."},
    {id:"l-41004-37",transcript:"北方人爱吃饺子，除了因为饺子味道鲜美，还因为人们忙了一年，过年时全家人坐在一起包饺子，是很好的交流机会。另外，还跟北方的气候有关，北方比南方寒冷，吃热饺子让人感觉很暖和、很舒服。",question:"说话人认为北方的气候怎么样？",options:["干燥","寒冷","暖和","常刮风"],answer:1,transcriptJa:"北方の人は餃子が好きだ。それは餃子の味が美味しいからだけでなく、一年間忙しく働いた人々が、正月に家族全員で座って餃子を包むことが、良い交流の機会になるからでもある。また、北方の気候とも関係がある。北方は南方より寒く、熱い餃子を食べると体が温まり、とても心地よく感じられるのだ。",transcriptPinyin:"Běifāng rén ài chī jiǎozi, chúle yīnwèi jiǎozi wèidao xiānměi, hái yīnwèi rénmen máng le yì nián, guònián shí quánjiā rén zuò zài yìqǐ bāo jiǎozi, shì hěn hǎo de jiāoliú jīhuì. Lìngwài, hái gēn běifāng de qìhòu yǒuguān, běifāng bǐ nánfāng hánlěng, chī rè jiǎozi ràng rén gǎnjué hěn nuǎnhuo, hěn shūfu."},
    {id:"l-41004-38",transcript:"教育不同性格的孩子要使用不同的办法：对那些活泼的孩子要给他们一些限制；对那些害羞的孩子要经常鼓励他们说出自己的看法，当他们这样做了以后，要表扬他们，这样才能让每一个孩子都健康地发展。",question:"根据这段话，教育孩子要考虑哪方面的不同？",options:["性别","性格","兴趣","标准"],answer:1,transcriptJa:"性格の異なる子供を教育するには、異なる方法を用いる必要がある。活発な子供にはある程度の制限を与えるべきであり、恥ずかしがり屋の子供には自分の考えを言うように常に励ますべきである。そうしたときには褒めてあげる。そうすることで初めて、すべての子供が健全に成長できるのだ。",transcriptPinyin:"Jiàoyù bùtóng xìnggé de háizi yào shǐyòng bùtóng de bànfǎ: duì nàxiē huópō de háizi yào gěi tāmen yìxiē xiànzhì; duì nàxiē hàixiū de háizi yào jīngcháng gǔlì tāmen shuōchū zìjǐ de kànfǎ, dāng tāmen zhèyàng zuò le yǐhòu, yào biǎoyáng tāmen, zhèyàng cáinéng ràng měi yí ge háizi dōu jiànkāng de fāzhǎn."},
    {id:"l-41004-39",transcript:"教育不同性格的孩子要使用不同的办法：对那些活泼的孩子要给他们一些限制；对那些害羞的孩子要经常鼓励他们说出自己的看法，当他们这样做了以后，要表扬他们，这样才能让每一个孩子都健康地发展。",question:"这段话主要谈什么？",options:["现代教育学","什么是感情","儿童的爱好","怎样教育孩子"],answer:3,transcriptJa:"性格の異なる子供を教育するには、異なる方法を用いる必要がある。活発な子供にはある程度の制限を与えるべきであり、恥ずかしがり屋の子供には自分の考えを言うように常に励ますべきである。そうしたときには褒めてあげる。そうすることで初めて、すべての子供が健全に成長できるのだ。",transcriptPinyin:"Jiàoyù bùtóng xìnggé de háizi yào shǐyòng bùtóng de bànfǎ: duì nàxiē huópō de háizi yào gěi tāmen yìxiē xiànzhì; duì nàxiē hàixiū de háizi yào jīngcháng gǔlì tāmen shuōchū zìjǐ de kànfǎ, dāng tāmen zhèyàng zuò le yǐhòu, yào biǎoyáng tāmen, zhèyàng cáinéng ràng měi yí ge háizi dōu jiànkāng de fāzhǎn."},
    {id:"l-41004-40",transcript:"一个人听一只小鸟叫，觉得很好听，尽管他完全不懂小鸟唱的是什么。一个人看一张画，他看来看去都看不懂画的是什么，但是仍然觉得好看。其实在人们不懂什么是美的时候，美一直都在，美不会因为人们不懂而改变。",question:"关于小鸟，可以知道什么？",options:["腿很长","羽毛很软","叫声很好听","喜欢听音乐"],answer:2,transcriptJa:"ある人が小鳥の鳴き声を聞いて、とても美しいと感じた。たとえ小鳥が何を歌っているのかまったく理解できなくても。ある人が一枚の絵を見て、何度見てもそれが何を描いているのか分からなくても、やはり美しいと感じる。実は、人々が美とは何かを理解していないときでも、美はずっと存在しており、人々が理解していないからといって美が変わることはないのだ。",transcriptPinyin:"Yí ge rén tīng yì zhī xiǎoniǎo jiào, juéde hěn hǎotīng, jǐnguǎn tā wánquán bù dǒng xiǎoniǎo chàng de shì shénme. Yí ge rén kàn yì zhāng huà, tā kàn lái kàn qù dōu kàn bù dǒng huà de shì shénme, dànshì réngrán juéde hǎokàn. Qíshí zài rénmen bù dǒng shénme shì měi de shíhou, měi yìzhí dōu zài, měi bú huì yīnwèi rénmen bù dǒng ér gǎibiàn."},
    {id:"l-41004-41",transcript:"一个人听一只小鸟叫，觉得很好听，尽管他完全不懂小鸟唱的是什么。一个人看一张画，他看来看去都看不懂画的是什么，但是仍然觉得好看。其实在人们不懂什么是美的时候，美一直都在，美不会因为人们不懂而改变。",question:"美有什么特点？",options:["很难判断","一直都在","让人兴奋","大家都能懂"],answer:1,transcriptJa:"ある人が小鳥の鳴き声を聞いて、とても美しいと感じた。たとえ小鳥が何を歌っているのかまったく理解できなくても。ある人が一枚の絵を見て、何度見てもそれが何を描いているのか分からなくても、やはり美しいと感じる。実は、人々が美とは何かを理解していないときでも、美はずっと存在しており、人々が理解していないからといって美が変わることはないのだ。",transcriptPinyin:"Yí ge rén tīng yì zhī xiǎoniǎo jiào, juéde hěn hǎotīng, jǐnguǎn tā wánquán bù dǒng xiǎoniǎo chàng de shì shénme. Yí ge rén kàn yì zhāng huà, tā kàn lái kàn qù dōu kàn bù dǒng huà de shì shénme, dànshì réngrán juéde hǎokàn. Qíshí zài rénmen bù dǒng shénme shì měi de shíhou, měi yìzhí dōu zài, měi bú huì yīnwèi rénmen bù dǒng ér gǎibiàn."},
    {id:"l-41004-42",transcript:"生活是什么？不同的人有不同的看法。有人说，生活是一杯酒，辣中带香；有人说，生活是一块巧克力，甜中带些苦；也有人说，生活是一个圆面包，最中间那部分是最好吃的，然而不是每个人都能吃到。生活究竟是什么？可能我们每个人都有自己的答案。",question:"这段话谈的是什么？",options:["职业","生活","食品","味道"],answer:1,transcriptJa:"人生とは何か？人によって考え方は異なる。ある人は、人生は一杯の酒で、辛さの中に香りがあると言う。ある人は、人生は一かけらのチョコレートで、甘さの中に少し苦みがあると言う。また、人生は丸いパンで、真ん中の部分が一番おいしいが、誰もがそれを食べられるわけではないと言う人もいる。人生とは結局何なのか？おそらく私たち一人一人が自分自身の答えを持っているのだろう。",transcriptPinyin:"Shēnghuó shì shénme? Bùtóng de rén yǒu bùtóng de kànfǎ. Yǒu rén shuō, shēnghuó shì yì bēi jiǔ, là zhōng dài xiāng; yǒu rén shuō, shēnghuó shì yí kuài qiǎokèlì, tián zhōng dài xiē kǔ; yě yǒu rén shuō, shēnghuó shì yí ge yuán miànbāo, zuì zhōngjiān nà bùfen shì zuì hǎochī de, rán'ér bú shì měi ge rén dōu néng chīdào. Shēnghuó jiūjìng shì shénme? Kěnéng wǒmen měi ge rén dōu yǒu zìjǐ de dá'àn."},
    {id:"l-41004-43",transcript:"生活是什么？不同的人有不同的看法。有人说，生活是一杯酒，辣中带香；有人说，生活是一块巧克力，甜中带些苦；也有人说，生活是一个圆面包，最中间那部分是最好吃的，然而不是每个人都能吃到。生活究竟是什么？可能我们每个人都有自己的答案。",question:"圆面包有什么特点？",options:["中间最好吃","不太受欢迎","样子很特别","价格很便宜"],answer:0,transcriptJa:"人生とは何か？人によって考え方は異なる。ある人は、人生は一杯の酒で、辛さの中に香りがあると言う。ある人は、人生は一かけらのチョコレートで、甘さの中に少し苦みがあると言う。また、人生は丸いパンで、真ん中の部分が一番おいしいが、誰もがそれを食べられるわけではないと言う人もいる。人生とは結局何なのか？おそらく私たち一人一人が自分自身の答えを持っているのだろう。",transcriptPinyin:"Shēnghuó shì shénme? Bùtóng de rén yǒu bùtóng de kànfǎ. Yǒu rén shuō, shēnghuó shì yì bēi jiǔ, là zhōng dài xiāng; yǒu rén shuō, shēnghuó shì yí kuài qiǎokèlì, tián zhōng dài xiē kǔ; yě yǒu rén shuō, shēnghuó shì yí ge yuán miànbāo, zuì zhōngjiān nà bùfen shì zuì hǎochī de, rán'ér bú shì měi ge rén dōu néng chīdào. Shēnghuó jiūjìng shì shénme? Kěnéng wǒmen měi ge rén dōu yǒu zìjǐ de dá'àn."},
    {id:"l-41004-44",transcript:"现在，做一个网站变得越来越容易了。不仅许多公司有网站，而且很多人都有自己的网站。访问各种各样的网站已经成为人们生活的一部分，网站，极大地丰富了现代人的精神生活。",question:"关于网站，下列哪个正确？",options:["十分普遍","合格的不多","数量在减少","内容都差不多"],answer:0,transcriptJa:"今、ウェブサイトを作ることはますます簡単になっている。多くの会社がウェブサイトを持っているだけでなく、多くの個人も自分のウェブサイトを持っている。さまざまなウェブサイトを閲覧することはすでに人々の生活の一部となっており、ウェブサイトは現代人の精神生活を大いに豊かにしている。",transcriptPinyin:"Xiànzài, zuò yí ge wǎngzhàn biàn de yuèláiyuè róngyì le. Bùjǐn xǔduō gōngsī yǒu wǎngzhàn, érqiě hěn duō rén dōu yǒu zìjǐ de wǎngzhàn. Fǎngwèn gèzhǒng gèyàng de wǎngzhàn yǐjīng chéngwéi rénmen shēnghuó de yí bùfen, wǎngzhàn, jídà de fēngfù le xiàndàirén de jīngshén shēnghuó."},
    {id:"l-41004-45",transcript:"现在，做一个网站变得越来越容易了。不仅许多公司有网站，而且很多人都有自己的网站。访问各种各样的网站已经成为人们生活的一部分，网站，极大地丰富了现代人的精神生活。",question:"说话人对网站是什么态度？",options:["支持","批评","怀疑","讨厌"],answer:0,transcriptJa:"今、ウェブサイトを作ることはますます簡単になっている。多くの会社がウェブサイトを持っているだけでなく、多くの個人も自分のウェブサイトを持っている。さまざまなウェブサイトを閲覧することはすでに人々の生活の一部となっており、ウェブサイトは現代人の精神生活を大いに豊かにしている。",transcriptPinyin:"Xiànzài, zuò yí ge wǎngzhàn biàn de yuèláiyuè róngyì le. Bùjǐn xǔduō gōngsī yǒu wǎngzhàn, érqiě hěn duō rén dōu yǒu zìjǐ de wǎngzhàn. Fǎngwèn gèzhǒng gèyàng de wǎngzhàn yǐjīng chéngwéi rénmen shēnghuó de yí bùfen, wǎngzhàn, jídà de fēngfù le xiàndàirén de jīngshén shēnghuó."},
    {id:"l-41005-01",transcript:"在接受调查的学生中，有超过百分之八十的人希望自己能有机会出国留学，但只有大约百分之二十的人已经开始申请国外学校。",question:"很多学生希望出国留学。",options:["对","错"],answer:0,transcriptJa:"調査を受けた学生のうち、80％以上の人が海外留学の機会を得たいと望んでいるが、実際に海外の学校への出願を始めている人はおよそ20％にすぎない。",transcriptPinyin:"Zài jiēshòu diàochá de xuésheng zhōng, yǒu chāoguò bǎifēnzhī bāshí de rén xīwàng zìjǐ néng yǒu jīhuì chūguó liúxué, dàn zhǐyǒu dàyuē bǎifēnzhī èrshí de rén yǐjīng kāishǐ shēnqǐng guówài xuéxiào."},
    {id:"l-41005-02",transcript:"你别跟我开玩笑了，我从来没学过游泳，怎么去比赛啊？你去问问小王吧，他每个周末都去游泳。",question:"他想参加网球比赛。",options:["对","错"],answer:1,transcriptJa:"冗談言わないでよ、私は今まで泳ぎを習ったことがないのに、どうやって試合に出るの？王くんに聞いてみて、彼は毎週末泳ぎに行ってるから。",transcriptPinyin:"Nǐ bié gēn wǒ kāiwánxiào le, wǒ cónglái méi xuéguo yóuyǒng, zěnme qù bǐsài a? Nǐ qù wènwen Xiǎo Wáng ba, tā měi ge zhōumò dōu qù yóuyǒng."},
    {id:"l-41005-03",transcript:"年轻就是健康，年轻就是美丽。不要太担心胖瘦，也不要太关心自己长得是不是漂亮，是不是帅，年轻人最重要的是要对自己有信心。",question:"年轻人应该相信自己。",options:["对","错"],answer:0,transcriptJa:"若さとは健康であり、若さとは美しさである。太っているか痩せているかをあまり気にしすぎず、自分が綺麗かどうか、かっこいいかどうかもあまり気にしすぎないほうがいい。若者にとって最も大切なのは、自分に自信を持つことだ。",transcriptPinyin:"Niánqīng jiùshì jiànkāng, niánqīng jiùshì měilì. Bú yào tài dānxīn pàng shòu, yě bú yào tài guānxīn zìjǐ zhǎng de shì bú shì piàoliang, shì bú shì shuài, niánqīngrén zuì zhòngyào de shì yào duì zìjǐ yǒu xìnxīn."},
    {id:"l-41005-04",transcript:"姐，咱们弄错方向了，去西边的公共汽车应该在对面坐。正好前边有个天桥，我们从那儿过马路吧。",question:"他们要坐地铁。",options:["对","错"],answer:1,transcriptJa:"お姉ちゃん、方向を間違えたよ。西へ行くバスは向かい側で乗らないといけない。ちょうど前に歩道橋があるから、そこから道を渡ろう。",transcriptPinyin:"Jiě, zánmen nòngcuò fāngxiàng le, qù xībian de gōnggòng qìchē yīnggāi zài duìmiàn zuò. Zhènghǎo qiánbian yǒu ge tiānqiáo, wǒmen cóng nàr guò mǎlù ba."},
    {id:"l-41005-05",transcript:"我喜欢阳光，因为阳光给了万物生命。因为有了阳光，花园里的小草更绿了；因为有了阳光，天空下的海洋更蓝了。",question:"阳光的作用很大。",options:["对","错"],answer:0,transcriptJa:"私は日光が好きだ。日光は万物に命を与えるから。日光があるからこそ、庭の草はより緑になり、日光があるからこそ、空の下の海はより青くなる。",transcriptPinyin:"Wǒ xǐhuan yángguāng, yīnwèi yángguāng gěi le wànwù shēngmìng. Yīnwèi yǒu le yángguāng, huāyuán lǐ de xiǎocǎo gèng lǜ le; yīnwèi yǒu le yángguāng, tiānkōng xià de hǎiyáng gèng lán le."},
    {id:"l-41005-06",transcript:"第一印象是指在第一次见面时给别人留下的印象，第一印象往往是最深的，而且很难改变。",question:"第一印象不容易忘记。",options:["对","错"],answer:0,transcriptJa:"第一印象とは、初めて会ったときに相手に与える印象のことを指す。第一印象は往々にして最も深く残り、変えるのが難しい。",transcriptPinyin:"Dì-yī yìnxiàng shì zhǐ zài dì-yī cì jiànmiàn shí gěi biéren liúxià de yìnxiàng, dì-yī yìnxiàng wǎngwǎng shì zuì shēn de, érqiě hěn nán gǎibiàn."},
    {id:"l-41005-07",transcript:"有能力的人可以把复杂的事情变简单，而没能力的人却经常把简单的事情变复杂。这就是这两种人的区别。",question:"没能力的人没有责任心。",options:["对","错"],answer:1,transcriptJa:"能力のある人は複雑な物事を簡単にすることができるが、能力のない人はよく簡単な物事を複雑にしてしまう。これがこの二種類の人の違いである。",transcriptPinyin:"Yǒu nénglì de rén kěyǐ bǎ fùzá de shìqing biàn jiǎndān, ér méi nénglì de rén què jīngcháng bǎ jiǎndān de shìqing biàn fùzá. Zhè jiùshì zhè liǎng zhǒng rén de qūbié."},
    {id:"l-41005-08",transcript:"我从小就非常喜欢读书。长大后，发现身边的图书越来越多，而时间是有限的，所以，不仅要会读书，还要会选择其中的好书来阅读。",question:"好书越来越少。",options:["对","错"],answer:1,transcriptJa:"私は小さい頃から読書がとても好きだった。大人になってから、身の回りの本がどんどん増えていく一方で、時間は限られていることに気づいた。だから、本を読めるだけでなく、その中から良い本を選んで読む力も必要なのだ。",transcriptPinyin:"Wǒ cóngxiǎo jiù fēicháng xǐhuan dúshū. Zhǎngdà hòu, fāxiàn shēnbiān de túshū yuèláiyuè duō, ér shíjiān shì yǒuxiàn de, suǒyǐ, bùjǐn yào huì dúshū, hái yào huì xuǎnzé qízhōng de hǎo shū lái yuèdú."},
    {id:"l-41005-09",transcript:"越来越多的人选择上网看新闻，因为这样很方便，网站的报道更及时，内容也更详细、丰富。",question:"很多人仍然爱看报纸。",options:["对","错"],answer:1,transcriptJa:"ますます多くの人がネットでニュースを見ることを選んでいる。そのほうが便利で、サイトの報道はより速く、内容もより詳しく豊富だからだ。",transcriptPinyin:"Yuèláiyuè duō de rén xuǎnzé shàngwǎng kàn xīnwén, yīnwèi zhèyàng hěn fāngbiàn, wǎngzhàn de bàodào gèng jíshí, nèiróng yě gèng xiángxì, fēngfù."},
    {id:"l-41005-10",transcript:"虽然还有一部分宾馆会向客人提供免费的毛巾、牙膏和牙刷，但是每次出差，她都会自己带这些东西，很少用宾馆里的。",question:"她不愿意用宾馆的毛巾。",options:["对","错"],answer:0,transcriptJa:"一部のホテルでは今も客に無料でタオルや歯磨き粉、歯ブラシを提供しているが、彼女は出張のたびにこれらのものを自分で持参し、ホテルのものを使うことはめったにない。",transcriptPinyin:"Suīrán hái yǒu yí bùfen bīnguǎn huì xiàng kèrén tígōng miǎnfèi de máojīn, yágāo hé yáshuā, dànshì měi cì chūchāi, tā dōu huì zìjǐ dài zhèxiē dōngxi, hěn shǎo yòng bīnguǎn lǐ de."},
    {id:"l-41005-11",transcript:"男：你钢琴弹得真好。\n女：我以前是钢琴老师，专门教儿童弹钢琴。",question:"女的原来的职业是什么？",options:["医生","护士","老师","售货员"],answer:2,transcriptJa:"男：ピアノが本当に上手ですね。\n女：以前ピアノの先生をしていて、子供にピアノを教えることを専門にしていました。",transcriptPinyin:"男：Nǐ gāngqín tán de zhēn hǎo.\n女：Wǒ yǐqián shì gāngqín lǎoshī, zhuānmén jiāo értóng tán gāngqín."},
    {id:"l-41005-12",transcript:"女：小李，我给你介绍个女朋友吧，说说你有什么条件。\n男：我，我喜欢活泼可爱的女孩子。",question:"男的觉得哪种女孩子比较好？",options:["聪明","勇敢","活泼可爱","个子矮的"],answer:2,transcriptJa:"女：李くん、彼女を紹介してあげようか。どんな条件が希望か言ってみて。\n男：僕は、活発でかわいい女の子が好きです。",transcriptPinyin:"女：Xiǎo Lǐ, wǒ gěi nǐ jièshào ge nǚpéngyou ba, shuōshuo nǐ yǒu shénme tiáojiàn.\n男：Wǒ, wǒ xǐhuan huópō kě'ài de nǚháizi."},
    {id:"l-41005-13",transcript:"男：王教授，您明天早上几点到？我去火车站接您。\n女：辛苦你了，我明天早上七点四十到北京。",question:"女的明天几点到北京？",options:["早上7：40","上午8点半","14：20","19：35"],answer:0,transcriptJa:"男：王教授、明日の朝何時に着かれますか？駅までお迎えに行きます。\n女：お疲れ様です、明日の朝7時40分に北京に着きます。",transcriptPinyin:"男：Wáng jiàoshòu, nín míngtiān zǎoshang jǐ diǎn dào? Wǒ qù huǒchēzhàn jiē nín.\n女：Xīnkǔ nǐ le, wǒ míngtiān zǎoshang qī diǎn sìshí dào Běijīng."},
    {id:"l-41005-14",transcript:"女：刚才太危险了，那辆车怎么回事？\n男：不知道，突然加速，估计是新手，刚学会开车。",question:"那辆车的司机怎么了？",options:["喝酒了","发烧了","不敢开车","车开得不好"],answer:3,transcriptJa:"女：さっきは本当に危なかった、あの車どうしたの？\n男：分からない、急に加速して。おそらく初心者で、運転を覚えたばかりなんだろう。",transcriptPinyin:"女：Gāngcái tài wēixiǎn le, nà liàng chē zěnme huí shì?\n男：Bù zhīdao, tūrán jiāsù, gūjì shì xīnshǒu, gāng xuéhuì kāichē."},
    {id:"l-41005-15",transcript:"男：今天是母亲节，记得给妈妈打个电话。\n女：谢谢您的提醒，差点儿忘记了，我现在就打。",question:"女的准备给谁打电话？",options:["父亲","母亲","丈夫","孩子"],answer:1,transcriptJa:"男：今日は母の日だよ、お母さんに電話するのを忘れないで。\n女：教えてくれてありがとう、危うく忘れるところだった、今すぐかけるわ。",transcriptPinyin:"男：Jīntiān shì Mǔqīn Jié, jìde gěi māma dǎ ge diànhuà.\n女：Xièxie nín de tíxǐng, chàdiǎnr wàngjì le, wǒ xiànzài jiù dǎ."},
    {id:"l-41005-16",transcript:"女：校长，这份材料我已经按照您的要求改好了。\n男：谢谢你，先放我办公桌上吧，你再帮我发一份传真。",question:"关于女的，可以知道什么？",options:["很不满意","在办签证","在收传真","材料改完了"],answer:3,transcriptJa:"女：校長先生、この資料はご要望通りに修正しました。\n男：ありがとう、まず私の机の上に置いておいて。それから、ファックスを1通送るのを手伝ってもらえますか。",transcriptPinyin:"女：Xiàozhǎng, zhè fèn cáiliào wǒ yǐjīng ànzhào nín de yāoqiú gǎihǎo le.\n男：Xièxie nǐ, xiān fàng wǒ bàngōngzhuō shàng ba, nǐ zài bāng wǒ fā yí fèn chuánzhēn."},
    {id:"l-41005-17",transcript:"男：真抱歉，明天我得加班，不能陪你去购物了。\n女：既然这样，只好安排在下周了，没关系。",question:"男的为什么不去购物了？",options:["要请客","要加班","有约会","要收拾行李"],answer:1,transcriptJa:"男：本当にごめん、明日残業しなきゃいけなくて、買い物に付き合えなくなった。\n女：それなら、来週に予定を変えるしかないね、大丈夫だよ。",transcriptPinyin:"男：Zhēn bàoqiàn, míngtiān wǒ děi jiābān, bù néng péi nǐ qù gòuwù le.\n女：Jìrán zhèyàng, zhǐhǎo ānpái zài xiàzhōu le, méi guānxi."},
    {id:"l-41005-18",transcript:"女：你叔叔刚打电话来说给你发了个电子邮件，让你查收。\n男：我正在收呢，真奇怪，一直说我的密码有错，没错啊。",question:"男的为什么感到奇怪？",options:["信没寄出","弟弟还没醒","打不开信箱","没见到阿姨"],answer:2,transcriptJa:"女：さっき叔父さんから電話があって、あなたにメールを送ったから確認してって。\n男：今受信してるところだけど、本当に変だな、ずっとパスワードが間違ってるって出る、間違ってないのに。",transcriptPinyin:"女：Nǐ shūshu gāng dǎ diànhuà lái shuō gěi nǐ fā le ge diànzǐ yóujiàn, ràng nǐ cháshōu.\n男：Wǒ zhèngzài shōu ne, zhēn qíguài, yìzhí shuō wǒ de mìmǎ yǒu cuò, méi cuò a."},
    {id:"l-41005-19",transcript:"男：这个酸菜鱼如果能再辣点儿就更好了。\n女：再辣点儿？你真行！我眼泪都快要辣出来了。",question:"女的怎么了？",options:["流泪了","吃饱了","觉得太辣","认为可惜"],answer:2,transcriptJa:"男：この酸菜魚、もう少し辛かったらもっといいのに。\n女：もっと辛く？あなたすごいね！私はもう辛さで涙が出そうだよ。",transcriptPinyin:"男：Zhège suāncàiyú rúguǒ néng zài là diǎnr jiù gèng hǎo le.\n女：Zài là diǎnr? Nǐ zhēn xíng! Wǒ yǎnlèi dōu kuàiyào là chūlái le."},
    {id:"l-41005-20",transcript:"女：我实在跑不动了，你让我休息一会儿吧。\n男：你才跑了十分钟，要坚持，至少再跑十分钟。",question:"男的是什么意思？",options:["散散步","别迟到","休息一下","再跑一会儿"],answer:3,transcriptJa:"女：もう本当に走れない、少し休ませて。\n男：まだ10分しか走ってないよ、頑張って、少なくともあと10分は走ろう。",transcriptPinyin:"女：Wǒ shízài pǎo bú dòng le, nǐ ràng wǒ xiūxi yíhuìr ba.\n男：Nǐ cái pǎo le shí fēnzhōng, yào jiānchí, zhìshǎo zài pǎo shí fēnzhōng."},
    {id:"l-41005-21",transcript:"男：小姐，这是我的报名表，是交给您吗？\n女：对。请等一下，请在这儿填一下您的联系电话。",question:"根据对话，可以知道什么？",options:["他们在理发","他俩是夫妻","男的想请假","男的在报名"],answer:3,transcriptJa:"男：すみません、これが私の申込書です、これはあなたに渡せばいいですか？\n女：はい。少々お待ちください、ここに連絡先の電話番号をご記入ください。",transcriptPinyin:"男：Xiǎojiě, zhè shì wǒ de bàomíngbiǎo, shì jiāo gěi nín ma?\n女：Duì. Qǐng děng yíxià, qǐng zài zhèr tián yíxià nín de liánxì diànhuà."},
    {id:"l-41005-22",transcript:"女：你们今天讨论得怎么样？有结果吗？\n男：大家都同意把招聘会推迟到五月十二号。",question:"大家希望什么时候举行招聘会？",options:["5月","6月","11月","12月"],answer:0,transcriptJa:"女：今日の話し合いはどうだった？結果は出た？\n男：みんな採用説明会を5月12日に延期することに同意したよ。",transcriptPinyin:"女：Nǐmen jīntiān tǎolùn de zěnmeyàng? Yǒu jiéguǒ ma?\n男：Dàjiā dōu tóngyì bǎ zhāopìnhuì tuīchí dào wǔ yuè shí'èr hào."},
    {id:"l-41005-23",transcript:"男：那箱饮料可不轻，还是我来搬吧。\n女：麻烦你了，还得请你帮忙，谢谢你。",question:"男的在帮女的做什么？",options:["擦桌子","搬饮料","修家具","整理房间"],answer:1,transcriptJa:"男：あの飲み物の箱は重いから、僕が運ぶよ。\n女：お手数おかけします、手伝ってもらってありがとう。",transcriptPinyin:"男：Nà xiāng yǐnliào kě bù qīng, háishi wǒ lái bān ba.\n女：Máfan nǐ le, hái děi qǐng nǐ bāngmáng, xièxie nǐ."},
    {id:"l-41005-24",transcript:"女：你知道怎么去世界公园吗？我明天要去那儿附近办点儿事。\n男：我对那儿也不太熟悉，不过网上有地图，我帮你查查。",question:"男的是什么意思？",options:["他认识路","他很准时","他上网查查","他们一起去"],answer:2,transcriptJa:"女：世界公園への行き方知ってる？明日そこの近くで用事があるの。\n男：僕もそこはあまり詳しくないけど、ネットに地図があるから調べてあげるよ。",transcriptPinyin:"女：Nǐ zhīdao zěnme qù Shìjiè Gōngyuán ma? Wǒ míngtiān yào qù nàr fùjìn bàn diǎnr shì.\n男：Wǒ duì nàr yě bú tài shúxī, búguò wǎngshàng yǒu dìtú, wǒ bāng nǐ chácha."},
    {id:"l-41005-25",transcript:"男：大夫，我的牙最近疼得厉害，不知道是怎么回事。\n女：你先躺这儿，好，张开嘴我看看。",question:"男的哪里不舒服？",options:["嘴","牙","头","耳朵"],answer:1,transcriptJa:"男：先生、最近歯がひどく痛むんです、どうしたのか分からなくて。\n女：まずここに横になってください。はい、口を開けて見せてください。",transcriptPinyin:"男：Dàifu, wǒ de yá zuìjìn téng de lìhai, bù zhīdao shì zěnme huí shì.\n女：Nǐ xiān tǎng zhèr, hǎo, zhāngkāi zuǐ wǒ kànkan."},
    {id:"l-41005-26",transcript:"女：今天怎么这么安静呀？\n男：刚刚经理让我写篇总结，我正考虑怎么写呢。\n女：总结？哪方面的？\n男：快到年底了，市场方面的。",question:"经理让男的做什么？",options:["道歉","写总结","翻译文章","感谢女的"],answer:1,transcriptJa:"女：今日はどうしてこんなに静かなの？\n男：さっき部長にまとめを書くよう言われて、どう書こうか考えているところなんだ。\n女：まとめ？どの方面の？\n男：もうすぐ年末だから、市場方面のだよ。",transcriptPinyin:"女：Jīntiān zěnme zhème ānjìng ya?\n男：Gānggāng jīnglǐ ràng wǒ xiě piān zǒngjié, wǒ zhèng kǎolǜ zěnme xiě ne.\n女：Zǒngjié? Nǎ fāngmiàn de?\n男：Kuài dào niándǐ le, shìchǎng fāngmiàn de."},
    {id:"l-41005-27",transcript:"男：奶奶，我去打羽毛球了，再见。\n女：等一下，你把那个塑料袋拿下去扔垃圾桶里。\n男：是那个红色的吗？\n女：对，就是洗衣机旁边那个。",question:"那个塑料袋是什么颜色的？",options:["白","黑","黄","红"],answer:3,transcriptJa:"男：おばあちゃん、バドミントンをしに行ってくるね、行ってきます。\n女：ちょっと待って、そのビニール袋を持って行ってゴミ箱に捨ててきて。\n男：あの赤いやつ？\n女：そう、洗濯機のそばにあるやつ。",transcriptPinyin:"男：Nǎinai, wǒ qù dǎ yǔmáoqiú le, zàijiàn.\n女：Děng yíxià, nǐ bǎ nàge sùliàodài ná xiàqù rēng lājītǒng lǐ.\n男：Shì nàge hóngsè de ma?\n女：Duì, jiùshì xǐyījī pángbiān nàge."},
    {id:"l-41005-28",transcript:"女：刘师傅，您孩子要上大学了吧？\n男：我正想找你呢，你说让他报个什么专业好呢？国际关系？\n女：这主要还得看孩子自己的意见。\n男：也对，那我回去再和他商量商量。",question:"女的是什么看法？",options:["学中文","别有压力","别打扰孩子","让孩子决定"],answer:3,transcriptJa:"女：劉さん、お子さんもうすぐ大学に入るんですよね？\n男：ちょうどあなたに相談しようと思っていたんです。何の専攻を選ばせたらいいと思いますか？国際関係とか？\n女：それは主にお子さん自身の意見次第だと思いますよ。\n男：それもそうですね、じゃあ帰ってもう一度彼と相談してみます。",transcriptPinyin:"女：Liú shīfu, nín háizi yào shàng dàxué le ba?\n男：Wǒ zhèng xiǎng zhǎo nǐ ne, nǐ shuō ràng tā bào ge shénme zhuānyè hǎo ne? Guójì guānxi?\n女：Zhè zhǔyào hái děi kàn háizi zìjǐ de yìjiàn.\n男：Yě duì, nà wǒ huíqù zài hé tā shāngliang shāngliang."},
    {id:"l-41005-29",transcript:"男：明天的考试有多少人参加？\n女：大约三百人。\n男：这儿的座位恐怕不够吧？要不要考虑换到旁边的那个教室？\n女：不用。这个大教室实际上能坐四百人。",question:"他们在谈什么？",options:["考试场地","周围环境","银行地址","参观人数"],answer:0,transcriptJa:"男：明日の試験には何人参加するの？\n女：だいたい300人くらい。\n男：ここの席じゃ足りないんじゃない？隣の教室に変えることを考えたほうがいいんじゃない？\n女：その必要はないよ。この大教室は実際400人座れるから。",transcriptPinyin:"男：Míngtiān de kǎoshì yǒu duōshao rén cānjiā?\n女：Dàyuē sānbǎi rén.\n男：Zhèr de zuòwèi kǒngpà bú gòu ba? Yào bú yào kǎolǜ huàndào pángbiān de nàge jiàoshì?\n女：Bú yòng. Zhège dà jiàoshì shíjìshang néng zuò sìbǎi rén."},
    {id:"l-41005-30",transcript:"女：好了吗？你今天吃得不多。\n男：本来我也不饿。出门前我吃了块儿巧克力蛋糕。\n女：好吧，剩下的我们带走？\n男：当然，不能浪费。",question:"他们最可能在哪儿？",options:["超市","商店","饭馆儿","大使馆"],answer:2,transcriptJa:"女：もういい？今日はあまり食べなかったね。\n男：もともとお腹が空いてなかったんだ。出かける前にチョコレートケーキを一切れ食べたから。\n女：分かった、残りは持ち帰る？\n男：もちろん、無駄にしちゃいけないから。",transcriptPinyin:"女：Hǎo le ma? Nǐ jīntiān chī de bù duō.\n男：Běnlái wǒ yě bú è. Chūmén qián wǒ chī le kuàir qiǎokèlì dàngāo.\n女：Hǎo ba, shèngxià de wǒmen dàizǒu?\n男：Dāngrán, bù néng làngfèi."},
    {id:"l-41005-31",transcript:"男：下午的面试怎么样？顺利吗？\n女：还行，他们问的问题都挺容易的。就是当时有点儿紧张。\n男：什么时候可以知道结果？\n女：明天或者后天吧，他们会打电话通知。",question:"女的觉得面试怎么样？",options:["不难","很轻松","时间短","不太正式"],answer:0,transcriptJa:"男：午後の面接どうだった？順調だった？\n女：まあまあ、聞かれた質問はどれも簡単だったよ。ただそのとき少し緊張したけど。\n男：結果はいつ分かるの？\n女：明日か明後日かな、電話で連絡が来るはず。",transcriptPinyin:"男：Xiàwǔ de miànshì zěnmeyàng? Shùnlì ma?\n女：Hái xíng, tāmen wèn de wèntí dōu tǐng róngyì de. Jiùshì dāngshí yǒudiǎnr jǐnzhāng.\n男：Shénme shíhou kěyǐ zhīdao jiéguǒ?\n女：Míngtiān huòzhě hòutiān ba, tāmen huì dǎ diànhuà tōngzhī."},
    {id:"l-41005-32",transcript:"女：工作半天了，起来活动活动。\n男：好，坐久了确实有些难受。\n女：今天天气不错，外面很凉快，我们去楼下走走？\n男：行，我顺便买本杂志。",question:"今天天气怎么样？",options:["很热","很凉快","刮大风了","要下雨了"],answer:1,transcriptJa:"女：半日働いたし、立って体を動かそうよ。\n男：うん、長く座っていると確かに疲れるね。\n女：今日は天気がいいし、外は涼しいから、下に降りて歩こうか？\n男：いいね、ついでに雑誌を1冊買ってくるよ。",transcriptPinyin:"女：Gōngzuò bàn tiān le, qǐlái huódòng huódòng.\n男：Hǎo, zuò jiǔ le quèshí yǒuxiē nánshòu.\n女：Jīntiān tiānqì búcuò, wàimiàn hěn liángkuai, wǒmen qù lóuxià zǒuzou?\n男：Xíng, wǒ shùnbiàn mǎi běn zázhì."},
    {id:"l-41005-33",transcript:"男：有空的时候欢迎你来我这儿玩儿。\n女：好的，不过暂时可能去不了，最近事情多。\n男：没问题。你最近忙什么呢？\n女：快放暑假了，学校要组织老师们去东南亚旅游。",question:"男的邀请女的做什么？",options:["去跳舞","去爬山","当警察","去他那儿玩儿"],answer:3,transcriptJa:"男：暇なときは僕のところに遊びに来て。\n女：うん、でも当分は行けないかも、最近忙しくて。\n男：大丈夫だよ。最近何を忙しくしてるの？\n女：もうすぐ夏休みになるから、学校が先生たちを東南アジア旅行に連れて行く予定なの。",transcriptPinyin:"男：Yǒu kòng de shíhou huānyíng nǐ lái wǒ zhèr wánr.\n女：Hǎo de, búguò zànshí kěnéng qù bùliǎo, zuìjìn shìqing duō.\n男：Méi wèntí. Nǐ zuìjìn máng shénme ne?\n女：Kuài fàng shǔjià le, xuéxiào yào zǔzhī lǎoshīmen qù Dōngnányà lǚyóu."},
    {id:"l-41005-34",transcript:"女：先生，这里禁止停车。\n男：这里不是停车场吗？\n女：不是，停车场在那边，离这儿不远。\n男：好，我马上开走。谢谢你。\n女：不客气。",question:"男的要去哪儿？",options:["长城","洗手间","停车场","足球场"],answer:2,transcriptJa:"女：お客様、ここは駐車禁止です。\n男：ここは駐車場じゃないんですか？\n女：違います、駐車場はあちらです、ここからそう遠くありません。\n男：分かりました、すぐに車を動かします。ありがとう。\n女：どういたしまして。",transcriptPinyin:"女：Xiānsheng, zhèlǐ jìnzhǐ tíngchē.\n男：Zhèlǐ bú shì tíngchēchǎng ma?\n女：Bú shì, tíngchēchǎng zài nàbian, lí zhèr bù yuǎn.\n男：Hǎo, wǒ mǎshàng kāizǒu. Xièxie nǐ.\n女：Bú kèqi."},
    {id:"l-41005-35",transcript:"男：复习得怎么样了？\n女：材料这么厚，我估计看不完了。\n男：来得及，复习要注意方法，要复习重点内容。\n女：只好这样了，这些语法知识太难了。",question:"男的认为应该怎么复习？",options:["要仔细","复习重点","加快速度","多做练习"],answer:1,transcriptJa:"男：復習はどう進んでる？\n女：資料がこんなに厚くて、読み終わらないと思う。\n男：間に合うよ、復習は方法に気をつけて、重要な内容を復習しないと。\n女：そうするしかないね、この文法の知識は本当に難しい。",transcriptPinyin:"男：Fùxí de zěnmeyàng le?\n女：Cáiliào zhème hòu, wǒ gūjì kàn bù wán le.\n男：Láidejí, fùxí yào zhùyì fāngfǎ, yào fùxí zhòngdiǎn nèiróng.\n女：Zhǐhǎo zhèyàng le, zhèxiē yǔfǎ zhīshi tài nán le."},
    {id:"l-41005-36",transcript:"提到结婚，人们会很自然地想起爱情。爱情确实是结婚的重要原因，但仅有爱情是不够的。两个人还应该互相支持，互相信任。只有这样才能很好地生活在一起。",question:"结婚的重要原因是什么？",options:["感动","爱情","受不了孤单","两个人很合适"],answer:1,transcriptJa:"結婚と言えば、人は自然と愛情を思い浮かべる。愛情は確かに結婚の重要な理由だが、愛情だけでは足りない。二人はさらに互いに支え合い、互いに信頼し合うべきである。そうして初めて、共に良い生活を送ることができるのだ。",transcriptPinyin:"Tídào jiéhūn, rénmen huì hěn zìrán de xiǎngqǐ àiqíng. Àiqíng quèshí shì jiéhūn de zhòngyào yuányīn, dàn jǐn yǒu àiqíng shì bú gòu de. Liǎng ge rén hái yīnggāi hùxiāng zhīchí, hùxiāng xìnrèn. Zhǐyǒu zhèyàng cáinéng hěn hǎo de shēnghuó zài yìqǐ."},
    {id:"l-41005-37",transcript:"提到结婚，人们会很自然地想起爱情。爱情确实是结婚的重要原因，但仅有爱情是不够的。两个人还应该互相支持，互相信任。只有这样才能很好地生活在一起。",question:"两个人怎样才能很好地一起生活？",options:["不要害羞","不要解释","减少误会","互相支持、信任"],answer:3,transcriptJa:"結婚と言えば、人は自然と愛情を思い浮かべる。愛情は確かに結婚の重要な理由だが、愛情だけでは足りない。二人はさらに互いに支え合い、互いに信頼し合うべきである。そうして初めて、共に良い生活を送ることができるのだ。",transcriptPinyin:"Tídào jiéhūn, rénmen huì hěn zìrán de xiǎngqǐ àiqíng. Àiqíng quèshí shì jiéhūn de zhòngyào yuányīn, dàn jǐn yǒu àiqíng shì bú gòu de. Liǎng ge rén hái yīnggāi hùxiāng zhīchí, hùxiāng xìnrèn. Zhǐyǒu zhèyàng cáinéng hěn hǎo de shēnghuó zài yìqǐ."},
    {id:"l-41005-38",transcript:"有个人看见一个孩子在路边哭，就问他为什么哭。孩子说刚才不小心丢了十块钱。见孩子那么难过，那个人就拿出十块钱送给他。没想到孩子哭得更难过了。那个人很奇怪，就问：“我刚才不是给你十块钱了吗？为什么还哭呢？”孩子回答：“如果没丢那十块钱，我现在已经有二十块了。”",question:"那个孩子为什么哭？",options:["钱丢了","打针了","爸爸生病了","被爷爷批评了"],answer:0,transcriptJa:"ある人が道端で子供が泣いているのを見かけ、なぜ泣いているのか尋ねた。子供は、さっきうっかり10元をなくしてしまったと言った。子供がそんなに悲しそうにしているのを見て、その人は10元を取り出して子供にあげた。ところが子供はもっと激しく泣き出した。その人は不思議に思い、「さっき10元をあげたのに、どうしてまだ泣いているの？」と尋ねた。子供は答えた。「もしあの10元をなくしていなければ、今頃20元持っていたのに」。",transcriptPinyin:"Yǒu ge rén kànjiàn yí ge háizi zài lùbiān kū, jiù wèn tā wèishénme kū. Háizi shuō gāngcái bù xiǎoxīn diū le shí kuài qián. Jiàn háizi nàme nánguò, nàge rén jiù náchū shí kuài qián sòng gěi tā. Méi xiǎngdào háizi kū de gèng nánguò le. Nàge rén hěn qíguài, jiù wèn: \"Wǒ gāngcái bú shì gěi nǐ shí kuài qián le ma? Wèishénme hái kū ne?\" Háizi huídá: \"Rúguǒ méi diū nà shí kuài qián, wǒ xiànzài yǐjīng yǒu èrshí kuài le.\""},
    {id:"l-41005-39",transcript:"有个人看见一个孩子在路边哭，就问他为什么哭。孩子说刚才不小心丢了十块钱。见孩子那么难过，那个人就拿出十块钱送给他。没想到孩子哭得更难过了。那个人很奇怪，就问：“我刚才不是给你十块钱了吗？为什么还哭呢？”孩子回答：“如果没丢那十块钱，我现在已经有二十块了。”",question:"那个孩子现在有多少钱？",options:["10块","20块","30块","100块"],answer:0,transcriptJa:"ある人が道端で子供が泣いているのを見かけ、なぜ泣いているのか尋ねた。子供は、さっきうっかり10元をなくしてしまったと言った。子供がそんなに悲しそうにしているのを見て、その人は10元を取り出して子供にあげた。ところが子供はもっと激しく泣き出した。その人は不思議に思い、「さっき10元をあげたのに、どうしてまだ泣いているの？」と尋ねた。子供は答えた。「もしあの10元をなくしていなければ、今頃20元持っていたのに」。",transcriptPinyin:"Yǒu ge rén kànjiàn yí ge háizi zài lùbiān kū, jiù wèn tā wèishénme kū. Háizi shuō gāngcái bù xiǎoxīn diū le shí kuài qián. Jiàn háizi nàme nánguò, nàge rén jiù náchū shí kuài qián sòng gěi tā. Méi xiǎngdào háizi kū de gèng nánguò le. Nàge rén hěn qíguài, jiù wèn: \"Wǒ gāngcái bú shì gěi nǐ shí kuài qián le ma? Wèishénme hái kū ne?\" Háizi huídá: \"Rúguǒ méi diū nà shí kuài qián, wǒ xiànzài yǐjīng yǒu èrshí kuài le.\""},
    {id:"l-41005-40",transcript:"幽默是一种让人羡慕的能力，有这种能力的人能在任何事情中发现有趣的东西，再无聊的事经过他们的嘴都可能变成笑话，甚至让人笑得肚子疼。一个有幽默感的人不管走到哪里，都会给别人带去愉快的心情，所以总是受到大家的欢迎。",question:"幽默的人怎么样？",options:["很诚实","做事马虎","会讲笑话","有时觉得无聊"],answer:2,transcriptJa:"ユーモアとは人に羨ましがられる能力であり、この能力を持つ人はどんな物事の中にも面白いものを見つけ出すことができる。どんなにつまらないことでも、彼らの口を通せば笑い話になり、人をお腹が痛くなるほど笑わせることさえある。ユーモアのセンスがある人はどこに行っても人に楽しい気分をもたらすので、いつもみんなに歓迎される。",transcriptPinyin:"Yōumò shì yì zhǒng ràng rén xiànmù de nénglì, yǒu zhè zhǒng nénglì de rén néng zài rènhé shìqing zhōng fāxiàn yǒuqù de dōngxi, zài wúliáo de shì jīngguò tāmen de zuǐ dōu kěnéng biànchéng xiàohua, shènzhì ràng rén xiào de dùzi téng. Yí ge yǒu yōumògǎn de rén bùguǎn zǒu dào nǎlǐ, dōu huì gěi biéren dàiqù yúkuài de xīnqíng, suǒyǐ zǒngshì shòudào dàjiā de huānyíng."},
    {id:"l-41005-41",transcript:"幽默是一种让人羡慕的能力，有这种能力的人能在任何事情中发现有趣的东西，再无聊的事经过他们的嘴都可能变成笑话，甚至让人笑得肚子疼。一个有幽默感的人不管走到哪里，都会给别人带去愉快的心情，所以总是受到大家的欢迎。",question:"幽默的人为什么受欢迎？",options:["使人快乐","十分礼貌","遇事冷静","能给人安全感"],answer:0,transcriptJa:"ユーモアとは人に羨ましがられる能力であり、この能力を持つ人はどんな物事の中にも面白いものを見つけ出すことができる。どんなにつまらないことでも、彼らの口を通せば笑い話になり、人をお腹が痛くなるほど笑わせることさえある。ユーモアのセンスがある人はどこに行っても人に楽しい気分をもたらすので、いつもみんなに歓迎される。",transcriptPinyin:"Yōumò shì yì zhǒng ràng rén xiànmù de nénglì, yǒu zhè zhǒng nénglì de rén néng zài rènhé shìqing zhōng fāxiàn yǒuqù de dōngxi, zài wúliáo de shì jīngguò tāmen de zuǐ dōu kěnéng biànchéng xiàohua, shènzhì ràng rén xiào de dùzi téng. Yí ge yǒu yōumògǎn de rén bùguǎn zǒu dào nǎlǐ, dōu huì gěi biéren dàiqù yúkuài de xīnqíng, suǒyǐ zǒngshì shòudào dàjiā de huānyíng."},
    {id:"l-41005-42",transcript:"许多人都有过后悔的经历，其实，只要我们按照自己的想法去做了，就没什么后悔的，因为我们不可能把所有的事情全部做对。另外，让我们走向成功的，往往是我们从过去做错的事情中得到的经验。",question:"许多人都有过怎样的经历？",options:["后悔","得意","紧张","激动"],answer:0,transcriptJa:"多くの人が後悔した経験を持っている。しかし実際には、自分の考えに従って行動しさえすれば、後悔することは何もない。なぜなら私たちがすべての物事を完璧にこなすことは不可能だからだ。また、私たちを成功へと導くのは、往々にして過去に間違えたことから得た経験なのである。",transcriptPinyin:"Xǔduō rén dōu yǒuguo hòuhuǐ de jīnglì, qíshí, zhǐyào wǒmen ànzhào zìjǐ de xiǎngfǎ qù zuò le, jiù méi shénme hòuhuǐ de, yīnwèi wǒmen bù kěnéng bǎ suǒyǒu de shìqing quánbù zuòduì. Lìngwài, ràng wǒmen zǒuxiàng chénggōng de, wǎngwǎng shì wǒmen cóng guòqù zuòcuò de shìqing zhōng dédào de jīngyàn."},
    {id:"l-41005-43",transcript:"许多人都有过后悔的经历，其实，只要我们按照自己的想法去做了，就没什么后悔的，因为我们不可能把所有的事情全部做对。另外，让我们走向成功的，往往是我们从过去做错的事情中得到的经验。",question:"什么能帮助我们走向成功？",options:["理想","努力工作","正确的方法","失败的经验"],answer:3,transcriptJa:"多くの人が後悔した経験を持っている。しかし実際には、自分の考えに従って行動しさえすれば、後悔することは何もない。なぜなら私たちがすべての物事を完璧にこなすことは不可能だからだ。また、私たちを成功へと導くのは、往々にして過去に間違えたことから得た経験なのである。",transcriptPinyin:"Xǔduō rén dōu yǒuguo hòuhuǐ de jīnglì, qíshí, zhǐyào wǒmen ànzhào zìjǐ de xiǎngfǎ qù zuò le, jiù méi shénme hòuhuǐ de, yīnwèi wǒmen bù kěnéng bǎ suǒyǒu de shìqing quánbù zuòduì. Lìngwài, ràng wǒmen zǒuxiàng chénggōng de, wǎngwǎng shì wǒmen cóng guòqù zuòcuò de shìqing zhōng dédào de jīngyàn."},
    {id:"l-41005-44",transcript:"今天，你们终于完成了大学四年的学习任务，马上就要开始新的生活了。我代表学校向同学们表示祝贺！祝你们在今后取得更大的成绩，也希望你们以后有时间多回学校来看看。",question:"说话人最可能是谁？",options:["导游","校长","记者","服务员"],answer:1,transcriptJa:"今日、皆さんはついに大学4年間の学業を終え、まもなく新しい生活を始めようとしています。学校を代表して、皆さんにお祝いを申し上げます！今後さらに大きな成果を収められますよう、そして今後時間があるときに、また学校に戻って見に来てくれることを願っています。",transcriptPinyin:"Jīntiān, nǐmen zhōngyú wánchéng le dàxué sì nián de xuéxí rènwu, mǎshàng jiù yào kāishǐ xīn de shēnghuó le. Wǒ dàibiǎo xuéxiào xiàng tóngxuémen biǎoshì zhùhè! Zhù nǐmen zài jīnhòu qǔdé gèng dà de chéngjì, yě xīwàng nǐmen yǐhòu yǒu shíjiān duō huí xuéxiào lái kànkan."},
    {id:"l-41005-45",transcript:"今天，你们终于完成了大学四年的学习任务，马上就要开始新的生活了。我代表学校向同学们表示祝贺！祝你们在今后取得更大的成绩，也希望你们以后有时间多回学校来看看。",question:"这段话最可能是在什么时候说的？",options:["访问","开学","毕业","放寒假"],answer:2,transcriptJa:"今日、皆さんはついに大学4年間の学業を終え、まもなく新しい生活を始めようとしています。学校を代表して、皆さんにお祝いを申し上げます！今後さらに大きな成果を収められますよう、そして今後時間があるときに、また学校に戻って見に来てくれることを願っています。",transcriptPinyin:"Jīntiān, nǐmen zhōngyú wánchéng le dàxué sì nián de xuéxí rènwu, mǎshàng jiù yào kāishǐ xīn de shēnghuó le. Wǒ dàibiǎo xuéxiào xiàng tóngxuémen biǎoshì zhùhè! Zhù nǐmen zài jīnhòu qǔdé gèng dà de chéngjì, yě xīwàng nǐmen yǐhòu yǒu shíjiān duō huí xuéxiào lái kànkan."},
    {id:"l-41006-01",transcript:"我妻子想减肥，所以她每天早上都去骑马。结果马竟然在一个月之内瘦了二十斤。",question:"妻子减肥很成功。",options:["对","错"],answer:1,transcriptJa:"妻はダイエットしたいと思い、毎朝馬に乗りに行っている。その結果、なんと馬のほうが1か月で20斤（10キロ）も痩せてしまった。",transcriptPinyin:"Wǒ qīzi xiǎng jiǎnféi, suǒyǐ tā měitiān zǎoshang dōu qù qímǎ. Jiéguǒ mǎ jìngrán zài yí ge yuè zhī nèi shòu le èrshí jīn."},
    {id:"l-41006-02",transcript:"天天在一起的朋友，不一定是你真正的朋友。真正的朋友，是那些当你遇到困难时会努力帮助你的人。",question:"对朋友要有耐心。",options:["对","错"],answer:1,transcriptJa:"毎日一緒にいる友人が、必ずしも本当の友人とは限らない。本当の友人とは、あなたが困難に遭ったときに全力で助けてくれる人のことだ。",transcriptPinyin:"Tiāntiān zài yìqǐ de péngyou, bù yídìng shì nǐ zhēnzhèng de péngyou. Zhēnzhèng de péngyou, shì nàxiē dāng nǐ yùdào kùnnan shí huì nǔlì bāngzhù nǐ de rén."},
    {id:"l-41006-03",transcript:"不同的态度会带来不同的生活。人们都希望生活会向着好的方向变化，当我们开始改变自己的态度时，这种变化就开始发生了。",question:"态度改变生活。",options:["对","错"],answer:0,transcriptJa:"異なる態度は異なる人生をもたらす。人はみな人生が良い方向へ変化することを望んでいるが、私たちが自分の態度を変え始めたとき、その変化はすでに始まっているのだ。",transcriptPinyin:"Bùtóng de tàidu huì dàilái bùtóng de shēnghuó. Rénmen dōu xīwàng shēnghuó huì xiàngzhe hǎo de fāngxiàng biànhuà, dāng wǒmen kāishǐ gǎibiàn zìjǐ de tàidu shí, zhè zhǒng biànhuà jiù kāishǐ fāshēng le."},
    {id:"l-41006-04",transcript:"科学研究发现，经常笑的人更容易感到幸福，而且更不容易生病。",question:"笑使人更健康。",options:["对","错"],answer:0,transcriptJa:"科学研究によれば、よく笑う人はより幸せを感じやすく、また病気にもかかりにくいことが分かっている。",transcriptPinyin:"Kēxué yánjiū fāxiàn, jīngcháng xiào de rén gèng róngyì gǎndào xìngfú, érqiě gèng bù róngyì shēngbìng."},
    {id:"l-41006-05",transcript:"我妈要给我理发，我有些怀疑：“您会理发吗？”她很有信心：“相信我，就算理坏了，我也有办法。”半小时后，妈妈说：“我给你买个帽子去。”",question:"妈妈理发的水平不高。",options:["对","错"],answer:0,transcriptJa:"母が私の髪を切ってくれるというので、私は少し疑って「切れるの？」と聞いた。母は自信満々に「私を信じて、たとえ失敗しても、なんとかする方法があるから」と言った。30分後、母は「帽子を買ってあげるわ」と言った。",transcriptPinyin:"Wǒ mā yào gěi wǒ lǐfà, wǒ yǒuxiē huáiyí: \"Nín huì lǐfà ma?\" Tā hěn yǒu xìnxīn: \"Xiāngxìn wǒ, jiùsuàn lǐhuài le, wǒ yě yǒu bànfǎ.\" Bàn xiǎoshí hòu, māma shuō: \"Wǒ gěi nǐ mǎi ge màozi qù.\""},
    {id:"l-41006-06",transcript:"到底该不该买房子，这是让一些人头疼的问题。因为已经很高的房价，将来可能会降下来，然而也有可能会变得更高。",question:"现在的房租很贵。",options:["对","错"],answer:1,transcriptJa:"家を買うべきかどうかは、一部の人にとって頭を悩ませる問題だ。すでに高い住宅価格は、将来下がるかもしれないし、逆にさらに高くなるかもしれないからだ。",transcriptPinyin:"Dàodǐ gāi bù gāi mǎi fángzi, zhè shì ràng yìxiē rén tóuténg de wèntí. Yīnwèi yǐjīng hěn gāo de fángjià, jiānglái kěnéng huì jiàng xiàlái, rán'ér yě yǒu kěnéng huì biàn de gèng gāo."},
    {id:"l-41006-07",transcript:"父母对子女的关心，远比子女们看到的、听到的要多得多。我们的生日他们每年都记得，而又有多少人会记着给父母过生日？",question:"父母要多表扬孩子。",options:["对","错"],answer:1,transcriptJa:"親が子供にかける気遣いは、子供たちが見たり聞いたりしているよりもはるかに多い。私たちの誕生日を親は毎年覚えているが、逆に親の誕生日を覚えている人がどれだけいるだろうか？",transcriptPinyin:"Fùmǔ duì zǐnǚ de guānxīn, yuǎn bǐ zǐnǚmen kàndào de, tīngdào de yào duō de duō. Wǒmen de shēngrì tāmen měinián dōu jìde, ér yòu yǒu duōshao rén huì jìzhe gěi fùmǔ guò shēngrì?"},
    {id:"l-41006-08",transcript:"每个人都有过一些不愉快的经历，如果总是把它们放在心里，只会让你前进的脚步慢下来。所以，现在是时候忘掉它们了。",question:"要忘掉不高兴的事情。",options:["对","错"],answer:0,transcriptJa:"誰にでも不愉快な経験はあるものだが、それをいつまでも心に留めておくと、前進する足取りを遅くするだけだ。だから、今こそそれらを忘れるべき時なのだ。",transcriptPinyin:"Měi ge rén dōu yǒuguo yìxiē bù yúkuài de jīnglì, rúguǒ zǒngshì bǎ tāmen fàng zài xīnlǐ, zhǐ huì ràng nǐ qiánjìn de jiǎobù màn xiàlái. Suǒyǐ, xiànzài shì shíhou wàngdiào tāmen le."},
    {id:"l-41006-09",transcript:"一个人性格幽默，并不是说他爱开玩笑，而是说他会开玩笑。幽默的人往往是活泼的、热情的、聪明的，所有的人都喜欢他。",question:"幽默的人很诚实。",options:["对","错"],answer:1,transcriptJa:"ある人がユーモアのある性格だというのは、その人が冗談を言うのが好きだということではなく、冗談を言うのが上手だということだ。ユーモアのある人は往々にして活発で、情熱的で、頭が良く、誰からも好かれる。",transcriptPinyin:"Yí ge rén xìnggé yōumò, bìng bú shì shuō tā ài kāiwánxiào, ér shì shuō tā huì kāiwánxiào. Yōumò de rén wǎngwǎng shì huópō de, rèqíng de, cōngmíng de, suǒyǒu de rén dōu xǐhuan tā."},
    {id:"l-41006-10",transcript:"成熟，并不只是说我们的年龄，更多的时候，成熟指的是我们做事的方法和责任感。",question:"成熟不仅仅和年龄有关。",options:["对","错"],answer:0,transcriptJa:"成熟とは、単に年齢のことを指すのではない。多くの場合、成熟とは私たちの物事のやり方と責任感を指すのである。",transcriptPinyin:"Chéngshú, bìng bù zhǐshì shuō wǒmen de niánlíng, gèng duō de shíhou, chéngshú zhǐ de shì wǒmen zuòshì de fāngfǎ hé zérèngǎn."},
    {id:"l-41006-11",transcript:"男：真的假的？马小姐的女儿已经五岁了？\n女：没想到吧？第一次见她的时候，我也以为她刚大学毕业。\n问：他们觉得马小姐怎么样？",question:"他们觉得马小姐怎么样？",options:["可怜","负责","个子矮","长得年轻"],answer:3,transcriptJa:"男：本当？馬さんの娘さんはもう5歳になったの？\n女：意外でしょう？初めて彼女に会ったとき、私も大学を卒業したばかりだと思ったよ。\n問：彼らは馬さんについてどう思っているか。",transcriptPinyin:"男：Zhēn de jiǎ de? Mǎ xiǎojiě de nǚ'ér yǐjīng wǔ suì le?\n女：Méi xiǎngdào ba? Dì-yī cì jiàn tā de shíhou, wǒ yě yǐwéi tā gāng dàxué bìyè.\n问：Tāmen juéde Mǎ xiǎojiě zěnmeyàng?"},
    {id:"l-41006-12",transcript:"女：这儿的风景真美呀，你看这草地，多绿啊！\n男：你站那儿别动，我给你照张相，再往左一点儿。\n问：他们最可能在哪儿？",question:"他们最可能在哪儿？",options:["宾馆","教室","树林中","大使馆"],answer:2,transcriptJa:"女：ここの景色は本当に美しいね、この草原を見て、なんて緑なんだろう！\n男：そこに立って動かないで、写真を撮ってあげるから。もう少し左に。\n問：彼らはどこにいる可能性が高いか。",transcriptPinyin:"女：Zhèr de fēngjǐng zhēn měi ya, nǐ kàn zhè cǎodì, duō lǜ a!\n男：Nǐ zhàn nàr bié dòng, wǒ gěi nǐ zhào zhāng xiàng, zài wǎng zuǒ yìdiǎnr.\n问：Tāmen zuì kěnéng zài nǎr?"},
    {id:"l-41006-13",transcript:"男：关于那个社会调查，我打算放弃，太复杂了。\n女：现在放弃，太可惜了，你还是再考虑考虑吧。\n问：女的主要是什么意思？",question:"女的主要是什么意思？",options:["很正常","感谢老师","感到抱歉","应该坚持"],answer:3,transcriptJa:"男：あの社会調査についてだけど、やめようと思う、複雑すぎて。\n女：今やめるなんてもったいないよ、もう一度よく考えてみて。\n問：女性が言いたいことは主に何か。",transcriptPinyin:"男：Guānyú nàge shèhuì diàochá, wǒ dǎsuàn fàngqì, tài fùzá le.\n女：Xiànzài fàngqì, tài kěxī le, nǐ háishi zài kǎolǜ kǎolǜ ba.\n问：Nǚ de zhǔyào shì shénme yìsi?"},
    {id:"l-41006-14",transcript:"女：小王，我们在哪儿见面啊？\n男：就在马路对面的天桥下吧，我马上就到。\n问：他们在哪儿见面？",question:"他们在哪儿见面？",options:["公园里","天桥下","办公室","电梯口"],answer:1,transcriptJa:"女：王さん、どこで会いましょうか？\n男：道路の向かいの歩道橋の下にしましょう、すぐ行きます。\n問：彼らはどこで会うか。",transcriptPinyin:"女：Xiǎo Wáng, wǒmen zài nǎr jiànmiàn a?\n男：Jiù zài mǎlù duìmiàn de tiānqiáo xià ba, wǒ mǎshàng jiù dào.\n问：Tāmen zài nǎr jiànmiàn?"},
    {id:"l-41006-15",transcript:"男：这个材料您那儿还有吗？我的那份被小张拿走了。\n女：有，或者我发你电子的吧。\n问：女的最可能要做什么？",question:"女的最可能要做什么？",options:["发传真","复印材料","写会议总结","发电子邮件"],answer:3,transcriptJa:"男：この資料、そちらにまだありますか？私の分は張さんに持って行かれてしまって。\n女：ありますよ、それか電子データで送りましょうか。\n問：女性は何をする可能性が高いか。",transcriptPinyin:"男：Zhège cáiliào nín nàr hái yǒu ma? Wǒ de nà fèn bèi Xiǎo Zhāng názǒu le.\n女：Yǒu, huòzhě wǒ fā nǐ diànzǐ de ba.\n问：Nǚ de zuì kěnéng yào zuò shénme?"},
    {id:"l-41006-16",transcript:"女：咱们先去吃晚饭，然后看电影，好不好？\n男：恐怕来不及吧？现在已经差一刻七点了。\n问：男的主要担心什么？",question:"男的主要担心什么？",options:["时间不够","路上堵车","顾客太多","没地方停车"],answer:0,transcriptJa:"女：先に夕飯を食べてから、映画を見に行こうよ、いい？\n男：たぶん間に合わないよ？今もう7時15分前だから。\n問：男性は主に何を心配しているか。",transcriptPinyin:"女：Zánmen xiān qù chī wǎnfàn, ránhòu kàn diànyǐng, hǎo bù hǎo?\n男：Kǒngpà láibují ba? Xiànzài yǐjīng chà yí kè qī diǎn le.\n问：Nán de zhǔyào dānxīn shénme?"},
    {id:"l-41006-17",transcript:"男：你已经到家了？你不是下周才回来吗？\n女：任务提前完成了，所以就先回来了，想给你个惊喜。\n问：女的为什么提前回家？",question:"女的为什么提前回家？",options:["亲戚结婚","准备出差","任务完成了","身体不舒服"],answer:2,transcriptJa:"男：もう家に着いたの？来週帰ってくる予定じゃなかった？\n女：任務が予定より早く終わったから、先に帰ってきたの、あなたを驚かせたくて。\n問：女性はなぜ早く帰ってきたか。",transcriptPinyin:"男：Nǐ yǐjīng dào jiā le? Nǐ bú shì xiàzhōu cái huílái ma?\n女：Rènwu tíqián wánchéng le, suǒyǐ jiù xiān huílái le, xiǎng gěi nǐ ge jīngxǐ.\n问：Nǚ de wèishénme tíqián huíjiā?"},
    {id:"l-41006-18",transcript:"女：经理，我丈夫生病了。我想请一天假，陪他去医院看看。\n男：好，你先把家里照顾好，我们周五见。\n问：根据对话，可以知道什么？",question:"根据对话，可以知道什么？",options:["女的感冒了","女的在请假","经理不同意","母亲很辛苦"],answer:1,transcriptJa:"女：部長、夫が病気になりました。1日休みをいただいて、病院に付き添いたいのですが。\n男：分かりました、まず家のことをちゃんとやってください、金曜日に会いましょう。\n問：会話から何が分かるか。",transcriptPinyin:"女：Jīnglǐ, wǒ zhàngfu shēngbìng le. Wǒ xiǎng qǐng yì tiān jià, péi tā qù yīyuàn kànkan.\n男：Hǎo, nǐ xiān bǎ jiā lǐ zhàogù hǎo, wǒmen zhōuwǔ jiàn.\n问：Gēnjù duìhuà, kěyǐ zhīdao shénme?"},
    {id:"l-41006-19",transcript:"男：您好，表格我已经填好了，您看可以吗？\n女：请留一下您的手机号，这样方便我们联系您。\n问：女的让男的做什么？",question:"女的让男的做什么？",options:["留地址","介绍菜单","留电话号码","重新填表格"],answer:2,transcriptJa:"男：こんにちは、用紙はもう記入し終わりました、これでよろしいですか？\n女：携帯電話の番号を残していただけますか、そうすればご連絡しやすくなりますので。\n問：女性は男性に何をさせようとしているか。",transcriptPinyin:"男：Nín hǎo, biǎogé wǒ yǐjīng tiánhǎo le, nín kàn kěyǐ ma?\n女：Qǐng liú yíxià nín de shǒujī hào, zhèyàng fāngbiàn wǒmen liánxì nín.\n问：Nǚ de ràng nán de zuò shénme?"},
    {id:"l-41006-20",transcript:"女：喂，刘先生，现在路上有些堵，我可能要迟到几分钟，真对不起。\n男：没关系，到了给我打电话，我下楼去接你。\n问：女的怎么了？",question:"女的怎么了？",options:["迟到了","生气了","很失望","还没出发"],answer:0,transcriptJa:"女：もしもし、劉さん、今道が少し混んでいて、数分遅れるかもしれません、本当にすみません。\n男：大丈夫ですよ、着いたら電話してください、下に降りて迎えに行きますから。\n問：女性はどうしたか。",transcriptPinyin:"女：Wéi, Liú xiānsheng, xiànzài lùshang yǒuxiē dǔ, wǒ kěnéng yào chídào jǐ fēnzhōng, zhēn duìbuqǐ.\n男：Méi guānxi, dào le gěi wǒ dǎ diànhuà, wǒ xiàlóu qù jiē nǐ.\n问：Nǚ de zěnme le?"},
    {id:"l-41006-21",transcript:"男：能谈谈你为什么会选择这份工作吗？\n女：首先，我对这份工作很感兴趣，其次，我学的也是这个专业，比较熟悉。\n问：男的最可能在做什么？",question:"男的最可能在做什么？",options:["招聘","约会","上课","道歉"],answer:0,transcriptJa:"男：なぜこの仕事を選んだのか話していただけますか？\n女：まず、この仕事にとても興味がありますし、次に、私が学んだのもこの専門なので、よく分かっています。\n問：男性は何をしている可能性が高いか。",transcriptPinyin:"男：Néng tántan nǐ wèishénme huì xuǎnzé zhè fèn gōngzuò ma?\n女：Shǒuxiān, wǒ duì zhè fèn gōngzuò hěn gǎn xìngqù, qící, wǒ xué de yě shì zhège zhuānyè, bǐjiào shúxī.\n问：Nán de zuì kěnéng zài zuò shénme?"},
    {id:"l-41006-22",transcript:"女：明天是六一儿童节，可别忘了给儿子买礼物，他想要块儿手表。\n男：你上次提醒我的时候，我就准备好了。\n问：为什么要给儿子准备礼物？",question:"为什么要给儿子准备礼物？",options:["新年到了","明天儿童节","手表很便宜","想鼓励儿子"],answer:1,transcriptJa:"女：明日は6月1日の子供の日だから、息子にプレゼントを買うのを忘れないでね、彼は腕時計が欲しいって。\n男：前回君が念を押してくれたとき、もう準備しておいたよ。\n問：なぜ息子にプレゼントを用意するのか。",transcriptPinyin:"女：Míngtiān shì Liù-Yī Értóng Jié, kě bié wàng le gěi érzi mǎi lǐwù, tā xiǎng yào kuàir shǒubiǎo.\n男：Nǐ shàng cì tíxǐng wǒ de shíhou, wǒ jiù zhǔnbèi hǎo le.\n问：Wèishénme yào gěi érzi zhǔnbèi lǐwù?"},
    {id:"l-41006-23",transcript:"男：这儿离长城大约还有四十公里。\n女：那再有半个小时就到了，我还以为很远呢。\n问：他们到长城还要多长时间？",question:"他们到长城还要多长时间？",options:["半小时","40分钟","一小时","一个半小时"],answer:0,transcriptJa:"男：ここから長城まではあと約40キロだよ。\n女：じゃああと30分で着くね、もっと遠いと思ってた。\n問：彼らは長城に着くまでどのくらいかかるか。",transcriptPinyin:"男：Zhèr lí Chángchéng dàyuē hái yǒu sìshí gōnglǐ.\n女：Nà zài yǒu bàn ge xiǎoshí jiù dào le, wǒ hái yǐwéi hěn yuǎn ne.\n问：Tāmen dào Chángchéng hái yào duō cháng shíjiān?"},
    {id:"l-41006-24",transcript:"女：这么得意，网球打得不错？\n男：比上回好多了，我现在至少能接到球了。\n问：男的网球打得怎么样？",question:"男的网球打得怎么样？",options:["很厉害","有提高","比以前差","完全不会"],answer:1,transcriptJa:"女：そんなに得意げにして、テニスがうまくなったの？\n男：前回よりずっとよくなったよ、今は少なくともボールを打ち返せるようになった。\n問：男性のテニスの腕前はどうか。",transcriptPinyin:"女：Zhème déyì, wǎngqiú dǎ de búcuò?\n男：Bǐ shàng huí hǎo duō le, wǒ xiànzài zhìshǎo néng jiēdào qiú le.\n问：Nán de wǎngqiú dǎ de zěnmeyàng?"},
    {id:"l-41006-25",transcript:"男：今天下午我们还是两点在东门集合吗？\n女：时间不变，地点改在西门了。快去整理一下东西吧，我们两点准时出发。\n问：他们什么时候出发？",question:"他们什么时候出发？",options:["上午8点","上午9点","中午12点","下午两点"],answer:3,transcriptJa:"男：今日の午後、やっぱり2時に東門で集合するの？\n女：時間は変わらないけど、場所は西門に変更になったよ。早く荷物をまとめて、2時ちょうどに出発するから。\n問：彼らはいつ出発するか。",transcriptPinyin:"男：Jīntiān xiàwǔ wǒmen háishi liǎng diǎn zài dōngmén jíhé ma?\n女：Shíjiān bú biàn, dìdiǎn gǎi zài xīmén le. Kuài qù zhěnglǐ yíxià dōngxi ba, wǒmen liǎng diǎn zhǔnshí chūfā.\n问：Tāmen shénme shíhou chūfā?"},
    {id:"l-41006-26",transcript:"女：你当时怎么会想去学表演呢？\n男：我爸是演员，从小受他的影响，我很喜欢表演艺术。\n女：原来是这样，你家里人一定也很支持你吧。\n男：其实，我妈希望我能做一个医生。\n问：男的最可能是做什么的？",question:"男的最可能是做什么的？",options:["律师","演员","大夫","记者"],answer:1,transcriptJa:"男：あなたは当時どうして演技を学ぼうと思ったのですか？\n女：父が俳優で、小さい頃から彼の影響を受けて、演技芸術がとても好きになったんです。\n女：なるほど、そうだったんですね、ご家族もきっと応援してくれているんでしょうね。\n男：実は、母は私に医者になってほしいと思っています。\n問：男性は何をしている可能性が高いか。",transcriptPinyin:"女：Nǐ dāngshí zěnme huì xiǎng qù xué biǎoyǎn ne?\n男：Wǒ bà shì yǎnyuán, cóngxiǎo shòu tā de yǐngxiǎng, wǒ hěn xǐhuan biǎoyǎn yìshù.\n女：Yuánlái shì zhèyàng, nǐ jiālǐrén yídìng yě hěn zhīchí nǐ ba.\n男：Qíshí, wǒ mā xīwàng wǒ néng zuò yí ge yīshēng.\n问：Nán de zuì kěnéng shì zuò shénme de?"},
