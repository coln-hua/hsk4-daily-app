    {id:"l-41006-34",transcript:"女：咱们这些家具都旧了，这次搬家，我们换新的。\n男：沙发换颜色亮一点儿的，现在这个颜色太深。\n女：对，另外，再买一个新洗衣机。\n男：行。\n问：根据对话，可以知道什么？",question:"根据对话，可以知道什么？",options:["窗户坏了","沙发太硬","他们要搬家","他们在逛街"],answer:2,transcriptJa:"女：うちのこれらの家具はもう古くなったから、今回の引っ越しで新しいものに替えよう。\n男：ソファはもう少し明るい色にしよう、今のこの色は暗すぎる。\n女：そうだね、それから、新しい洗濯機も買おう。\n男：いいよ。\n問：会話から何が分かるか。",transcriptPinyin:"女：Zánmen zhèxiē jiājù dōu jiù le, zhè cì bānjiā, wǒmen huàn xīn de.\n男：Shāfā huàn yánsè liàng yìdiǎnr de, xiànzài zhège yánsè tài shēn.\n女：Duì, lìngwài, zài mǎi yí ge xīn xǐyījī.\n男：Xíng.\n问：Gēnjù duìhuà, kěyǐ zhīdao shénme?"},
    {id:"l-41006-35",transcript:"男：谈什么呢？这么热闹。\n女：我们在商量寒假去哪儿玩儿呢，你有什么好主意？\n男：我想去南方旅游。\n女：好啊，那你这个北方人来组织怎么样？\n问：女的希望男的怎么样？",question:"女的希望男的怎么样？",options:["乘坐飞机","寄信回来","出国访问","组织大家旅游"],answer:3,transcriptJa:"男：何を話してるの？そんなに盛り上がって。\n女：冬休みにどこに遊びに行くか相談してるの、何かいい考えある？\n男：僕は南の方へ旅行に行きたいな。\n女：いいね、じゃああなたこの北方人が企画するのはどう？\n問：女性は男性にどうしてほしいと思っているか。",transcriptPinyin:"男：Tán shénme ne? Zhème rènao.\n女：Wǒmen zài shāngliang hánjià qù nǎr wánr ne, nǐ yǒu shénme hǎo zhǔyi?\n男：Wǒ xiǎng qù nánfāng lǚyóu.\n女：Hǎo a, nà nǐ zhège běifāngrén lái zǔzhī zěnmeyàng?\n问：Nǚ de xīwàng nán de zěnmeyàng?"},
    {id:"l-41006-36",transcript:"小孙子拿了一个苹果，没洗就吃了。吃完后，觉得肚子疼，很难受。于是他就去喝水，差不多喝光了一桶水。爷爷见了，奇怪地问他：“你为什么喝那么多水？”孙子说：“我刚吃了个苹果，忘记洗了。”",question:"吃了苹果后，小孙子觉得怎么样？",options:["很渴","很饱","肚子疼","有些累"],answer:2,transcriptJa:"孫がりんごを一つ手に取り、洗わずに食べてしまった。食べ終わった後、お腹が痛くなり、とても辛くなった。そこで彼は水を飲みに行き、バケツ一杯分近くの水を飲み干してしまった。おじいさんはそれを見て、不思議そうに「どうしてそんなにたくさん水を飲むんだ？」と尋ねた。孫は「さっきりんごを食べたんだけど、洗うのを忘れたんだ」と答えた。",transcriptPinyin:"Xiǎo sūnzi ná le yí ge píngguǒ, méi xǐ jiù chī le. Chīwán hòu, juéde dùzi téng, hěn nánshòu. Yúshì tā jiù qù hē shuǐ, chàbuduō hēguāng le yì tǒng shuǐ. Yéye jiàn le, qíguài de wèn tā: \"Nǐ wèishénme hē nàme duō shuǐ?\" Sūnzi shuō: \"Wǒ gāng chī le ge píngguǒ, wàngjì xǐ le.\""},
    {id:"l-41006-37",transcript:"小孙子拿了一个苹果，没洗就吃了。吃完后，觉得肚子疼，很难受。于是他就去喝水，差不多喝光了一桶水。爷爷见了，奇怪地问他：“你为什么喝那么多水？”孙子说：“我刚吃了个苹果，忘记洗了。”",question:"小孙子为什么喝了很多水？",options:["要洗苹果","皮肤干燥","为了出汗","不想浪费水"],answer:0,transcriptJa:"孫がりんごを一つ手に取り、洗わずに食べてしまった。食べ終わった後、お腹が痛くなり、とても辛くなった。そこで彼は水を飲みに行き、バケツ一杯分近くの水を飲み干してしまった。おじいさんはそれを見て、不思議そうに「どうしてそんなにたくさん水を飲むんだ？」と尋ねた。孫は「さっきりんごを食べたんだけど、洗うのを忘れたんだ」と答えた。",transcriptPinyin:"Xiǎo sūnzi ná le yí ge píngguǒ, méi xǐ jiù chī le. Chīwán hòu, juéde dùzi téng, hěn nánshòu. Yúshì tā jiù qù hē shuǐ, chàbuduō hēguāng le yì tǒng shuǐ. Yéye jiàn le, qíguài de wèn tā: \"Nǐ wèishénme hē nàme duō shuǐ?\" Sūnzi shuō: \"Wǒ gāng chī le ge píngguǒ, wàngjì xǐ le.\""},
    {id:"l-41006-38",transcript:"不管做什么事情，都应该有计划。有句话说得好：“昨晚多几分钟的准备，今天少几小时的麻烦。”这就是告诉我们，提前做好准备可以使事情更顺利地完成，减少出现麻烦的可能。",question:"提前计划有什么好处？",options:["减少麻烦","增加收入","提前结束","得到奖金"],answer:0,transcriptJa:"何をするにしても、計画を立てるべきである。「昨夜数分多く準備すれば、今日は数時間分のトラブルが減る」という言葉があるが、これはまさに、前もって準備をしておけば物事をより順調に成し遂げることができ、トラブルが起こる可能性を減らせるということを教えてくれている。",transcriptPinyin:"Bùguǎn zuò shénme shìqing, dōu yīnggāi yǒu jìhuà. Yǒu jù huà shuō de hǎo: \"Zuówǎn duō jǐ fēnzhōng de zhǔnbèi, jīntiān shǎo jǐ xiǎoshí de máfan.\" Zhè jiùshì gàosu wǒmen, tíqián zuòhǎo zhǔnbèi kěyǐ shǐ shìqing gèng shùnlì de wánchéng, jiǎnshǎo chūxiàn máfan de kěnéng."},
    {id:"l-41006-39",transcript:"不管做什么事情，都应该有计划。有句话说得好：“昨晚多几分钟的准备，今天少几小时的麻烦。”这就是告诉我们，提前做好准备可以使事情更顺利地完成，减少出现麻烦的可能。",question:"这段话主要想告诉我们什么？",options:["按时休息","能力是关键","做事要主动","要早做准备"],answer:3,transcriptJa:"何をするにしても、計画を立てるべきである。「昨夜数分多く準備すれば、今日は数時間分のトラブルが減る」という言葉があるが、これはまさに、前もって準備をしておけば物事をより順調に成し遂げることができ、トラブルが起こる可能性を減らせるということを教えてくれている。",transcriptPinyin:"Bùguǎn zuò shénme shìqing, dōu yīnggāi yǒu jìhuà. Yǒu jù huà shuō de hǎo: \"Zuówǎn duō jǐ fēnzhōng de zhǔnbèi, jīntiān shǎo jǐ xiǎoshí de máfan.\" Zhè jiùshì gàosu wǒmen, tíqián zuòhǎo zhǔnbèi kěyǐ shǐ shìqing gèng shùnlì de wánchéng, jiǎnshǎo chūxiàn máfan de kěnéng."},
    {id:"l-41006-40",transcript:"生活就像一个五味瓶，里面酸、甜、苦、辣、咸都有。当我们快乐幸福时，它是甜的；伤心难过时，它是酸的；失败流泪时，它是苦的……但无论哪一种味道都必不可少，因为正是这些味道组成了我们丰富多彩的生活。",question:"“甜”代表什么？",options:["安静","兴奋激动","快乐幸福","竞争的过程"],answer:2,transcriptJa:"人生はまるで五味の瓶のようなもので、その中には酸っぱさ、甘さ、苦さ、辛さ、しょっぱさがすべて入っている。私たちが楽しく幸せなとき、それは甘い。悲しく辛いとき、それは酸っぱい。失敗して涙を流すとき、それは苦い……しかしどの味も欠くことはできない。なぜなら、まさにこれらの味が私たちの豊かで彩り豊かな人生を作り上げているからだ。",transcriptPinyin:"Shēnghuó jiù xiàng yí ge wǔwèipíng, lǐmiàn suān, tián, kǔ, là, xián dōu yǒu. Dāng wǒmen kuàilè xìngfú shí, tā shì tián de; shāngxīn nánguò shí, tā shì suān de; shībài liúlèi shí, tā shì kǔ de……dàn wúlùn nǎ yì zhǒng wèidao dōu bìbùkěshǎo, yīnwèi zhèngshì zhèxiē wèidao zǔchéng le wǒmen fēngfù duōcǎi de shēnghuó."},
    {id:"l-41006-41",transcript:"生活就像一个五味瓶，里面酸、甜、苦、辣、咸都有。当我们快乐幸福时，它是甜的；伤心难过时，它是酸的；失败流泪时，它是苦的……但无论哪一种味道都必不可少，因为正是这些味道组成了我们丰富多彩的生活。",question:"这段话主要谈的是什么？",options:["季节","生活","市场","理想"],answer:1,transcriptJa:"人生はまるで五味の瓶のようなもので、その中には酸っぱさ、甘さ、苦さ、辛さ、しょっぱさがすべて入っている。私たちが楽しく幸せなとき、それは甘い。悲しく辛いとき、それは酸っぱい。失敗して涙を流すとき、それは苦い……しかしどの味も欠くことはできない。なぜなら、まさにこれらの味が私たちの豊かで彩り豊かな人生を作り上げているからだ。",transcriptPinyin:"Shēnghuó jiù xiàng yí ge wǔwèipíng, lǐmiàn suān, tián, kǔ, là, xián dōu yǒu. Dāng wǒmen kuàilè xìngfú shí, tā shì tián de; shāngxīn nánguò shí, tā shì suān de; shībài liúlèi shí, tā shì kǔ de……dàn wúlùn nǎ yì zhǒng wèidao dōu bìbùkěshǎo, yīnwèi zhèngshì zhèxiē wèidao zǔchéng le wǒmen fēngfù duōcǎi de shēnghuó."},
    {id:"l-41006-42",transcript:"世界上有那么多的考试，很多考试我们无法拒绝，不得不参加，否则我们连“进门”的机会都没有。但只会考试，没有真正的知识和经验，就算你进了门也看不到世界的精彩。",question:"人们为什么要考试？",options:["反映问题","获得机会","想读研究生","养成好习惯"],answer:1,transcriptJa:"世の中にはあれほど多くの試験があり、私たちは多くの試験を拒否できず、参加せざるを得ない。そうでなければ、私たちは「入り口に入る」機会さえも得られないからだ。しかし試験ができるだけで、本当の知識と経験がなければ、たとえ入り口に入れたとしても、世界の素晴らしさを見ることはできない。",transcriptPinyin:"Shìjiè shàng yǒu nàme duō de kǎoshì, hěn duō kǎoshì wǒmen wúfǎ jùjué, bùdébù cānjiā, fǒuzé wǒmen lián \"jìnmén\" de jīhuì dōu méiyǒu. Dàn zhǐ huì kǎoshì, méiyǒu zhēnzhèng de zhīshi hé jīngyàn, jiùsuàn nǐ jìn le mén yě kàn bú dào shìjiè de jīngcǎi."},
    {id:"l-41006-43",transcript:"世界上有那么多的考试，很多考试我们无法拒绝，不得不参加，否则我们连“进门”的机会都没有。但只会考试，没有真正的知识和经验，就算你进了门也看不到世界的精彩。",question:"要看到世界的精彩，需要什么？",options:["友谊","高级眼镜","知识和经验","流利的中文"],answer:2,transcriptJa:"世の中にはあれほど多くの試験があり、私たちは多くの試験を拒否できず、参加せざるを得ない。そうでなければ、私たちは「入り口に入る」機会さえも得られないからだ。しかし試験ができるだけで、本当の知識と経験がなければ、たとえ入り口に入れたとしても、世界の素晴らしさを見ることはできない。",transcriptPinyin:"Shìjiè shàng yǒu nàme duō de kǎoshì, hěn duō kǎoshì wǒmen wúfǎ jùjué, bùdébù cānjiā, fǒuzé wǒmen lián \"jìnmén\" de jīhuì dōu méiyǒu. Dàn zhǐ huì kǎoshì, méiyǒu zhēnzhèng de zhīshi hé jīngyàn, jiùsuàn nǐ jìn le mén yě kàn bú dào shìjiè de jīngcǎi."},
    {id:"l-41006-44",transcript:"有个人在黑板上画了一个圆，问不同的学生：“看到这个圆，想到什么了？”大学生觉得太简单，不愿意回答；中学生认为是数字零；小学生的回答却多种多样：月亮、太阳、乒乓球、西红柿等等。",question:"那个人在黑板上画了什么？",options:["圆","鸡蛋","葡萄","眼睛"],answer:0,transcriptJa:"ある人が黒板に丸を一つ描き、様々な学生に「この丸を見て、何を思い浮かべますか？」と尋ねた。大学生は簡単すぎると思って答えたがらなかった。中学生は数字のゼロだと考えた。小学生の答えはさまざまで、月、太陽、卓球のボール、トマトなどだった。",transcriptPinyin:"Yǒu ge rén zài hēibǎn shàng huà le yí ge yuán, wèn bùtóng de xuésheng: \"Kàndào zhège yuán, xiǎngdào shénme le?\" Dàxuéshēng juéde tài jiǎndān, bú yuànyì huídá; zhōngxuéshēng rènwéi shì shùzì líng; xiǎoxuéshēng de huídá què duō zhǒng duō yàng: yuèliang, tàiyáng, pīngpāngqiú, xīhóngshì děngděng."},
    {id:"l-41006-45",transcript:"有个人在黑板上画了一个圆，问不同的学生：“看到这个圆，想到什么了？”大学生觉得太简单，不愿意回答；中学生认为是数字零；小学生的回答却多种多样：月亮、太阳、乒乓球、西红柿等等。",question:"大学生觉得这个问题怎么样？",options:["太简单","不好解释","需要讨论","无正确答案"],answer:0,transcriptJa:"ある人が黒板に丸を一つ描き、様々な学生に「この丸を見て、何を思い浮かべますか？」と尋ねた。大学生は簡単すぎると思って答えたがらなかった。中学生は数字のゼロだと考えた。小学生の答えはさまざまで、月、太陽、卓球のボール、トマトなどだった。",transcriptPinyin:"Yǒu ge rén zài hēibǎn shàng huà le yí ge yuán, wèn bùtóng de xuésheng: \"Kàndào zhège yuán, xiǎngdào shénme le?\" Dàxuéshēng juéde tài jiǎndān, bú yuànyì huídá; zhōngxuéshēng rènwéi shì shùzì líng; xiǎoxuéshēng de huídá què duō zhǒng duō yàng: yuèliang, tàiyáng, pīngpāngqiú, xīhóngshì děngděng."},
    {id:"l-41007-01",transcript:"与公共汽车相比，地铁最大的优点是不会堵车。所以，很多人选择乘坐地铁上下班。",question:"地铁不会堵车。",options:["对","错"],answer:0,transcriptJa:"バスと比べて、地下鉄の最大の利点は渋滞しないことだ。だから、多くの人が通勤に地下鉄を選んでいる。",transcriptPinyin:"Yǔ gōnggòng qìchē xiāngbǐ, dìtiě zuì dà de yōudiǎn shì bú huì dǔchē. Suǒyǐ, hěn duō rén xuǎnzé chéngzuò dìtiě shàngxiàbān."},
    {id:"l-41007-02",transcript:"其实，只要我们真正努力过了，就不需要太关心结果。因为无论最后是成功还是失败，在努力的过程中，我们已经学到了很多东西。",question:"结果比过程更重要。",options:["对","错"],answer:1,transcriptJa:"実は、私たちが本当に努力しさえすれば、結果をあまり気にする必要はない。なぜなら、最終的に成功しようが失敗しようが、努力する過程で私たちはすでに多くのことを学んでいるからだ。",transcriptPinyin:"Qíshí, zhǐyào wǒmen zhēnzhèng nǔlìguo le, jiù bù xūyào tài guānxīn jiéguǒ. Yīnwèi wúlùn zuìhòu shì chénggōng háishi shībài, zài nǔlì de guòchéng zhōng, wǒmen yǐjīng xuédào le hěn duō dōngxi."},
    {id:"l-41007-03",transcript:"马经理这两天去上海出差了，现在不在公司。您如果有什么着急的事情找他，可以打他的手机。",question:"马经理不在上海。",options:["对","错"],answer:1,transcriptJa:"馬部長はここ数日上海に出張していて、今は会社にいません。もし急ぎの用件で彼に連絡が必要でしたら、携帯電話にかけてください。",transcriptPinyin:"Mǎ jīnglǐ zhè liǎng tiān qù Shànghǎi chūchāi le, xiànzài bú zài gōngsī. Nín rúguǒ yǒu shénme zháojí de shìqing zhǎo tā, kěyǐ dǎ tā de shǒujī."},
    {id:"l-41007-04",transcript:"幽默是一把钥匙，它能帮助人们打开友谊的大门。因为与幽默的人聊天儿总是很快乐。",question:"幽默的人容易交朋友。",options:["对","错"],answer:0,transcriptJa:"ユーモアは一本の鍵であり、人々が友情の扉を開ける手助けをしてくれる。なぜなら、ユーモアのある人とおしゃべりするのはいつも楽しいからだ。",transcriptPinyin:"Yōumò shì yì bǎ yàoshi, tā néng bāngzhù rénmen dǎkāi yǒuyì de dàmén. Yīnwèi yǔ yōumò de rén liáotiānr zǒngshì hěn kuàilè."},
    {id:"l-41007-05",transcript:"毕业是一件让人高兴的事，因为我们将要开始新的生活。毕业也是一件让人伤心的事，许多平时常在一起的朋友，以后见面的机会将变得很少。",question:"毕业让人又高兴又难过。",options:["对","错"],answer:0,transcriptJa:"卒業は人を喜ばせる出来事だ、なぜなら私たちはこれから新しい生活を始めるからだ。卒業はまた人を悲しませる出来事でもある、普段よく一緒にいた多くの友人と、これから会う機会がとても少なくなってしまうからだ。",transcriptPinyin:"Bìyè shì yí jiàn ràng rén gāoxìng de shì, yīnwèi wǒmen jiāngyào kāishǐ xīn de shēnghuó. Bìyè yě shì yí jiàn ràng rén shāngxīn de shì, xǔduō píngshí cháng zài yìqǐ de péngyou, yǐhòu jiànmiàn de jīhuì jiāng biàn de hěn shǎo."},
    {id:"l-41007-06",transcript:"小时候，他希望自己将来成为一名勇敢的警察。长大后，他却成为一名优秀的律师，用自己的法律知识来帮助别人。",question:"他现在是警察。",options:["对","错"],answer:1,transcriptJa:"子供の頃、彼は将来勇敢な警察官になりたいと思っていた。大人になった今、彼は優秀な弁護士となり、自分の法律の知識を使って人を助けている。",transcriptPinyin:"Xiǎoshíhou, tā xīwàng zìjǐ jiānglái chéngwéi yì míng yǒnggǎn de jǐngchá. Zhǎngdà hòu, tā què chéngwéi yì míng yōuxiù de lǜshī, yòng zìjǐ de fǎlǜ zhīshi lái bāngzhù biéren."},
    {id:"l-41007-07",transcript:"足球受到很多人的喜爱，世界杯比赛不仅吸引了很多观众，也吸引了许多公司。那些公司相信，通过赛场上的广告，能让更多的人了解它们。",question:"世界杯吸引了很多公司。",options:["对","错"],answer:0,transcriptJa:"サッカーは多くの人に愛されており、ワールドカップの試合は多くの観客を引きつけるだけでなく、多くの企業も引きつけている。それらの企業は、試合会場での広告を通じて、より多くの人に自分たちを知ってもらえると信じている。",transcriptPinyin:"Zúqiú shòudào hěn duō rén de xǐ'ài, Shìjièbēi bǐsài bùjǐn xīyǐn le hěn duō guānzhòng, yě xīyǐn le xǔduō gōngsī. Nàxiē gōngsī xiāngxìn, tōngguò sàichǎng shàng de guǎnggào, néng ràng gèng duō de rén liǎojiě tāmen."},
    {id:"l-41007-08",transcript:"请安静一下，大家请注意，我们马上就到目的地了，请大家带好行李，准备下车，我先带大家去宾馆。",question:"他是售货员。",options:["对","错"],answer:1,transcriptJa:"少し静かにしてください、皆さん注意してください、まもなく目的地に到着します。皆さん荷物をお持ちになって、下車の準備をしてください。まず皆さんをホテルにご案内します。",transcriptPinyin:"Qǐng ānjìng yíxià, dàjiā qǐng zhùyì, wǒmen mǎshàng jiù dào mùdìdì le, qǐng dàjiā dàihǎo xíngli, zhǔnbèi xiàchē, wǒ xiān dài dàjiā qù bīnguǎn."},
    {id:"l-41007-09",transcript:"父母应该找时间和孩子一起玩儿游戏，这样不但可以增进父母和孩子之间的感情交流，而且可以让父母暂时忘记工作的压力。",question:"孩子要少玩儿游戏。",options:["对","错"],answer:1,transcriptJa:"親は時間を見つけて子供と一緒にゲームをするべきだ。そうすれば親子間の感情の交流を深められるだけでなく、親が一時的に仕事のストレスを忘れることもできる。",transcriptPinyin:"Fùmǔ yīnggāi zhǎo shíjiān hé háizi yìqǐ wánr yóuxì, zhèyàng búdàn kěyǐ zēngjìn fùmǔ hé háizi zhījiān de gǎnqíng jiāoliú, érqiě kěyǐ ràng fùmǔ zànshí wàngjì gōngzuò de yālì."},
    {id:"l-41007-10",transcript:"小李，麻烦你跟司机说一声，我的手表忘在房间里了，得回去取一下，让他在楼下等我几分钟，我马上就来。",question:"司机在楼下。",options:["对","错"],answer:0,transcriptJa:"李さん、すみませんが運転手さんに伝えてください、私の腕時計を部屋に忘れてきたので、取りに戻らなければなりません。下で数分待っていてもらってください、すぐ行きますので。",transcriptPinyin:"Xiǎo Lǐ, máfan nǐ gēn sījī shuō yì shēng, wǒ de shǒubiǎo wàng zài fángjiān lǐ le, děi huíqù qǔ yíxià, ràng tā zài lóuxià děng wǒ jǐ fēnzhōng, wǒ mǎshàng jiù lái."},
    {id:"l-41007-11",transcript:"男：这个帽子挺漂亮的，你戴上试试？\n女：这个不适合我，再去前面看看别的吧。\n问：女的觉得帽子怎么样？",question:"女的觉得帽子怎么样？",options:["很好看","很高级","颜色暗","不合适"],answer:3,transcriptJa:"男：この帽子、なかなかきれいだね、被ってみたら？\n女：これは私に似合わないよ、前の方に行って他のを見てみよう。\n問：女性は帽子についてどう思っているか。",transcriptPinyin:"男：Zhège màozi tǐng piàoliang de, nǐ dàishàng shìshi?\n女：Zhège bú shìhé wǒ, zài qù qiánmiàn kànkan bié de ba."},
    {id:"l-41007-12",transcript:"女：能再给我一张表格吗？我把民族和性别填反了。\n男：请稍等，我再打印一张。\n问：女的刚才把什么填错了？",question:"女的刚才把什么填错了？",options:["出生地","兴趣和爱好","姓名和职业","民族和性别"],answer:3,transcriptJa:"女：もう1枚用紙をいただけますか？民族と性別を逆に記入してしまいました。\n男：少々お待ちください、もう1枚印刷します。\n問：女性はさっき何を記入し間違えたか。",transcriptPinyin:"女：Néng zài gěi wǒ yì zhāng biǎogé ma? Wǒ bǎ mínzú hé xìngbié tiánfǎn le.\n男：Qǐng shāo děng, wǒ zài dǎyìn yì zhāng."},
    {id:"l-41007-13",transcript:"男：怎么又买这么多饼干和巧克力，难道你不减肥了？\n女：减了一个月都没有瘦下来，我实在没有信心了。\n问：女的是什么意思？",question:"女的是什么意思？",options:["不想吃饭","需要鼓励","放弃减肥","继续运动"],answer:2,transcriptJa:"男：どうしてまたこんなにたくさんクッキーとチョコレートを買ったの？もうダイエットしないの？\n女：1か月ダイエットしても全然痩せなかったから、本当に自信がなくなっちゃった。\n問：女性が言いたいことは何か。",transcriptPinyin:"男：Zěnme yòu mǎi zhème duō bǐnggān hé qiǎokèlì, nándào nǐ bù jiǎnféi le?\n女：Jiǎn le yí ge yuè dōu méiyǒu shòu xiàlái, wǒ shízài méiyǒu xìnxīn le."},
    {id:"l-41007-14",transcript:"女：你的腿怎么流血了？我带你去医院吧。\n男：没关系，刚才踢足球不小心擦破了皮，不疼。\n问：男的刚才怎么了？",question:"男的刚才怎么了？",options:["哭了","被骗了","腿擦破了","把篮球丢了"],answer:2,transcriptJa:"女：あなたの足、どうして血が出てるの？病院に連れて行くよ。\n男：大丈夫、さっきサッカーをしていてうっかり擦りむいただけで、痛くないよ。\n問：男性はさっきどうしたか。",transcriptPinyin:"女：Nǐ de tuǐ zěnme liúxiě le? Wǒ dài nǐ qù yīyuàn ba.\n男：Méi guānxi, gāngcái tī zúqiú bù xiǎoxīn cāpò le pí, bù téng."},
    {id:"l-41007-15",transcript:"男：早上起床，要先把窗户打开，让新鲜空气进来。\n女：我刚去洗脸了，还没来得及开呢，这就开。\n问：女的没来得及做什么？",question:"女的没来得及做什么？",options:["洗澡","跑步","开窗户","打扫洗手间"],answer:2,transcriptJa:"男：朝起きたら、まず窓を開けて新鮮な空気を入れないと。\n女：さっき顔を洗いに行ってて、まだ開ける時間がなかったの、今すぐ開けるね。\n問：女性は何をする時間がなかったか。",transcriptPinyin:"男：Zǎoshang qǐchuáng, yào xiān bǎ chuānghu dǎkāi, ràng xīnxiān kōngqì jìnlái.\n女：Wǒ gāng qù xǐliǎn le, hái méi láidejí kāi ne, zhè jiù kāi."},
    {id:"l-41007-16",transcript:"女：喂，我在超市入口这儿呢，你怎么还没到？\n男：我对这儿不太熟悉，好了，我看见你了，马上到，先挂了。\n问：他们打算在哪儿见面？",question:"他们打算在哪儿见面？",options:["公园对面","超市入口","教室门口","火车站旁边"],answer:1,transcriptJa:"女：もしもし、私スーパーの入口にいるんだけど、どうしてまだ着かないの？\n男：ここはあまり詳しくなくて。あ、見えた、すぐ行くよ、じゃあ切るね。\n問：彼らはどこで会うつもりか。",transcriptPinyin:"女：Wéi, wǒ zài chāoshì rùkǒu zhèr ne, nǐ zěnme hái méi dào?\n男：Wǒ duì zhèr bú tài shúxī, hǎo le, wǒ kànjiàn nǐ le, mǎshàng dào, xiān guà le."},
    {id:"l-41007-17",transcript:"男：明天你打车直接去机场，不用来接我了，我坐地铁去，很方便。\n女：也行，那咱们明天机场见。\n问：男的明天怎么去机场？",question:"男的明天怎么去机场？",options:["开车","坐地铁","坐出租车","骑自行车"],answer:1,transcriptJa:"男：明日は直接タクシーで空港に行って、僕を迎えに来なくていいよ、地下鉄で行くから、便利だし。\n女：それでもいいよ、じゃあ明日空港で会おう。\n問：男性は明日どうやって空港に行くか。",transcriptPinyin:"男：Míngtiān nǐ dǎchē zhíjiē qù jīchǎng, bú yòng lái jiē wǒ le, wǒ zuò dìtiě qù, hěn fāngbiàn.\n女：Yě xíng, nà zánmen míngtiān jīchǎng jiàn."},
    {id:"l-41007-18",transcript:"女：每天要按时吃药，注意休息，月底再来检查一次。\n男：明白了，谢谢大夫，再见。\n问：关于男的，可以知道什么？",question:"关于男的，可以知道什么？",options:["很粗心","生病了","爱抽烟","刚刚打针了"],answer:1,transcriptJa:"女：毎日時間通りに薬を飲んで、休養に気をつけて、月末にもう一度検査に来てください。\n男：分かりました、先生ありがとうございます、失礼します。\n問：男性について何が分かるか。",transcriptPinyin:"女：Měitiān yào ànshí chīyào, zhùyì xiūxi, yuèdǐ zài lái jiǎnchá yí cì.\n男：Míngbai le, xièxie dàifu, zàijiàn."},
    {id:"l-41007-19",transcript:"男：小赵，由你负责写这次会议的总结怎么样？\n女：没问题，您放心，周四我就可以给您。\n问：女的觉得这个任务怎么样？",question:"女的觉得这个任务怎么样？",options:["很危险","比较奇怪","不用担心","没办法完成"],answer:2,transcriptJa:"男：趙さん、今回の会議のまとめはあなたに担当してもらうのはどうですか？\n女：大丈夫です、ご安心ください、木曜日にはお渡しできます。\n問：女性はこの任務についてどう思っているか。",transcriptPinyin:"男：Xiǎo Zhào, yóu nǐ fùzé xiě zhè cì huìyì de zǒngjié zěnmeyàng?\n女：Méi wèntí, nín fàngxīn, zhōusì wǒ jiù kěyǐ gěi nín."},
    {id:"l-41007-20",transcript:"女：孙师傅，您昨天下午出去了？\n男：对，我陪几个客人去了趟长城，然后就回公司了，有什么事吗？\n问：男的陪谁去长城了？",question:"男的陪谁去长城了？",options:["客人","邻居","妻子","哥哥"],answer:0,transcriptJa:"女：孫さん、昨日の午後出かけていましたか？\n男：はい、お客様を何人か連れて長城に行って、それから会社に戻りました。何かありましたか？\n問：男性は誰と長城に行ったか。",transcriptPinyin:"女：Sūn shīfu, nín zuótiān xiàwǔ chūqù le?\n男：Duì, wǒ péi jǐ ge kèrén qù le tàng Chángchéng, ránhòu jiù huí gōngsī le, yǒu shénme shì ma?"},
    {id:"l-41007-21",transcript:"男：终于到家了，快把空调打开，真是热死了。\n女：打开了，真希望下一场大雨，让天气凉快下来。\n问：女的为什么希望下场大雨？",question:"女的为什么希望下场大雨？",options:["气温高","更浪漫","可以睡懒觉","不想去锻炼"],answer:0,transcriptJa:"男：やっと家に着いた、早くエアコンをつけて、本当に暑くて死にそうだ。\n女：つけたよ、本当に大雨が降って、涼しくなってほしいな。\n問：女性はなぜ大雨が降ってほしいと思っているか。",transcriptPinyin:"男：Zhōngyú dào jiā le, kuài bǎ kōngtiáo dǎkāi, zhēn shì rè sǐ le.\n女：Dǎkāi le, zhēn xīwàng xià yì chǎng dàyǔ, ràng tiānqì liángkuai xiàlái."},
    {id:"l-41007-22",transcript:"女：李先生，这是给您留的座位，您请。\n男：谢谢，先给我们来两杯绿茶，把菜单给我，我来点菜。\n问：男的想要喝什么？",question:"男的想要喝什么？",options:["咖啡","果汁","绿茶","啤酒"],answer:2,transcriptJa:"女：李様、こちらがお取りしておいた席です、どうぞ。\n男：ありがとう、まず緑茶を2杯持ってきてください、メニューをください、注文しますので。\n問：男性は何を飲みたいか。",transcriptPinyin:"女：Lǐ xiānsheng, zhè shì gěi nín liú de zuòwèi, nín qǐng.\n男：Xièxie, xiān gěi wǒmen lái liǎng bēi lǜchá, bǎ càidān gěi wǒ, wǒ lái diǎncài."},
    {id:"l-41007-23",transcript:"男：这本小说这么厚，什么时候才能看完啊。\n女：每天晚上看十几页，差不多一个月就可以看完。\n问：男的认为这本书怎么样？",question:"男的认为这本书怎么样？",options:["太厚","无聊","很有名","翻译得不好"],answer:0,transcriptJa:"男：この小説はこんなに厚くて、いつになったら読み終わるんだろう。\n女：毎晩十数ページ読めば、だいたい1か月で読み終わるよ。\n問：男性はこの本についてどう思っているか。",transcriptPinyin:"男：Zhè běn xiǎoshuō zhème hòu, shénme shíhou cáinéng kànwán a.\n女：Měitiān wǎnshang kàn shí jǐ yè, chàbuduō yí ge yuè jiù kěyǐ kànwán."},
    {id:"l-41007-24",transcript:"女：今天中午我们出去吃吧。\n男：好，附近刚开了一家饭馆儿，菜做得很好吃，而且不贵。\n问：关于那个饭馆儿，可以知道什么？",question:"关于那个饭馆儿，可以知道什么？",options:["菜便宜","汤免费","服务差","正在打折"],answer:0,transcriptJa:"女：今日のお昼は外に食べに行こうよ。\n男：いいね、近くに最近レストランが1軒開店して、料理がとても美味しくて、しかも高くないんだ。\n問：そのレストランについて何が分かるか。",transcriptPinyin:"女：Jīntiān zhōngwǔ wǒmen chūqù chī ba.\n男：Hǎo, fùjìn gāng kāi le yì jiā fànguǎnr, cài zuò de hěn hǎochī, érqiě bú guì."},
    {id:"l-41007-25",transcript:"男：这份材料我看过了，我的意见都写在上面了。\n女：谢谢您，我们回去后会按照您的意见再重新整理一下。\n问：男的在材料上写什么了？",question:"男的在材料上写什么了？",options:["密码","一些解释","一些意见","招聘说明"],answer:2,transcriptJa:"男：この資料は見ました、私の意見はすべて上に書いておきました。\n女：ありがとうございます、戻りましたらご意見に従ってもう一度整理し直します。\n問：男性は資料に何を書いたか。",transcriptPinyin:"男：Zhè fèn cáiliào wǒ kànguo le, wǒ de yìjiàn dōu xiě zài shàngmiàn le.\n女：Xièxie nín, wǒmen huíqù hòu huì ànzhào nín de yìjiàn zài chóngxīn zhěnglǐ yíxià."},
    {id:"l-41007-26",transcript:"女：把香蕉皮扔到垃圾桶里去，以后别随便扔东西。\n男：知道了，奶奶。\n女：数学作业写完了吗？\n男：没呢，我先出去玩儿一会儿，您在家休息吧。\n问：根据对话，可以知道什么？",question:"根据对话，可以知道什么？",options:["天黑了","西瓜不好吃","孙子去上课","作业没写完"],answer:3,transcriptJa:"女：バナナの皮はゴミ箱に捨てて、これからは物を勝手に捨てないで。\n男：分かったよ、おばあちゃん。\n女：数学の宿題は終わったの？\n男：まだだよ、先にちょっと遊びに行ってくる、おばあちゃんは家で休んでて。\n問：会話から何が分かるか。",transcriptPinyin:"女：Bǎ xiāngjiāopí rēngdào lājītǒng lǐ qù, yǐhòu bié suíbiàn rēng dōngxi.\n男：Zhīdao le, nǎinai.\n女：Shùxué zuòyè xiěwán le ma?\n男：Méi ne, wǒ xiān chūqù wánr yíhuìr, nín zài jiā xiūxi ba."},
    {id:"l-41007-27",transcript:"男：您能给我们介绍一些您的成功经验吗？\n女：我觉得要重视平时的积累，要多向周围的人学习。\n男：那您觉得您最大的优点是什么呢？\n女：是诚实。\n问：女的觉得自己怎么样？",question:"女的觉得自己怎么样？",options:["很勇敢","很诚实","很可爱","很有礼貌"],answer:1,transcriptJa:"男：あなたの成功の経験を少し教えていただけますか？\n女：普段からの積み重ねを重視すること、そして周りの人からたくさん学ぶことが大切だと思います。\n男：では、あなたの最大の長所は何だと思いますか？\n女：誠実さです。\n問：女性は自分自身についてどう思っているか。",transcriptPinyin:"男：Nín néng gěi wǒmen jièshào yìxiē nín de chénggōng jīngyàn ma?\n女：Wǒ juéde yào zhòngshì píngshí de jīlěi, yào duō xiàng zhōuwéi de rén xuéxí.\n男：Nà nín juéde nín zuì dà de yōudiǎn shì shénme ne?\n女：Shì chéngshí."},
    {id:"l-41007-28",transcript:"女：小王，你也来商场购物啊？\n男：我要买个行李箱。您要买什么？\n女：今天休息，所以过来逛逛。你买行李箱要去哪儿？\n男：我周末要去外地演出。\n问：男的最可能是做什么的？",question:"男的最可能是做什么的？",options:["医生","记者","演员","运动员"],answer:2,transcriptJa:"女：王さん、あなたもデパートに買い物に来たの？\n男：スーツケースを買いたいんです。あなたは何を買うんですか？\n女：今日は休みだから、ぶらぶら見に来たの。スーツケースを買ってどこに行くの？\n男：週末に地方で公演があるんです。\n問：男性は何をしている可能性が高いか。",transcriptPinyin:"女：Xiǎo Wáng, nǐ yě lái shāngchǎng gòuwù a?\n男：Wǒ yào mǎi ge xínglixiāng. Nín yào mǎi shénme?\n女：Jīntiān xiūxi, suǒyǐ guòlái guàngguang. Nǐ mǎi xínglixiāng yào qù nǎr?\n男：Wǒ zhōumò yào qù wàidì yǎnchū."},
    {id:"l-41007-29",transcript:"男：你那儿最近有什么好消息没？\n女：好消息和坏消息各有一个，你先听哪个？\n男：那你先说坏消息是什么？\n女：以前那家奶牛场不向我们提供牛奶了。好消息是我们又联系上了另一家奶牛场。\n问：以前的奶牛场怎么了？",question:"以前的奶牛场怎么了？",options:["搬走了","生意不好","牛奶不合格","不提供牛奶了"],answer:3,transcriptJa:"男：最近そちらで何かいいニュースある？\n女：いいニュースと悪いニュースがそれぞれ一つずつあるけど、どっちから聞く？\n男：じゃあまず悪いニュースを教えて。\n女：以前のあの牧場が私たちに牛乳を提供してくれなくなったの。いいニュースは、また別の牧場と連絡が取れたこと。\n問：以前の牧場はどうなったか。",transcriptPinyin:"男：Nǐ nàr zuìjìn yǒu shénme hǎo xiāoxi méi?\n女：Hǎo xiāoxi hé huài xiāoxi gè yǒu yí ge, nǐ xiān tīng nǎge?\n男：Nà nǐ xiān shuō huài xiāoxi shì shénme?\n女：Yǐqián nà jiā nǎiniúchǎng bú xiàng wǒmen tígōng niúnǎi le. Hǎo xiāoxi shì wǒmen yòu liánxìshàng le lìng yì jiā nǎiniúchǎng."},
    {id:"l-41007-30",transcript:"女：去年夏天我去国外旅游，没想到买回来的礼物竟然都是中国制造。\n男：这很正常，中国现在是世界制造大国。\n女：是，随着质量的进一步提高，相信会有更多的中国制造。\n男：当然，我们还需要继续提高质量，提高竞争力。\n问：他们在谈什么？",question:"他们在谈什么？",options:["中国制造","旅行计划","环境污染","科学精神"],answer:0,transcriptJa:"女：去年の夏、私は海外旅行に行ったんだけど、思いがけず買って帰ったお土産が全部中国製だったの。\n男：それは普通のことだよ、中国は今や世界の製造大国だから。\n女：そうね、品質がさらに向上するにつれて、もっと多くの中国製品が出てくると思う。\n男：もちろん、私たちはさらに品質を高めて、競争力を上げる必要があるね。\n問：彼らは何について話しているか。",transcriptPinyin:"女：Qùnián xiàtiān wǒ qù guówài lǚyóu, méi xiǎngdào mǎi huílái de lǐwù jìngrán dōu shì Zhōngguó zhìzào.\n男：Zhè hěn zhèngcháng, Zhōngguó xiànzài shì shìjiè zhìzào dàguó.\n女：Shì, suízhe zhìliàng de jìnyíbù tígāo, xiāngxìn huì yǒu gèng duō de Zhōngguó zhìzào.\n男：Dāngrán, wǒmen hái xūyào jìxù tígāo zhìliàng, tígāo jìngzhēnglì."},
    {id:"l-41007-31",transcript:"男：听说你从小就开始写日记了？\n女：是，开始是老师要求写，写每天发生的有意思的事，慢慢就成习惯了。\n男：你觉得写日记有什么好处？\n女：可以给我留下一些美好的回忆。\n问：刚开始是谁要求她写日记的？",question:"刚开始是谁要求她写日记的？",options:["丈夫","爷爷","阿姨","老师"],answer:3,transcriptJa:"男：小さい頃から日記を書き始めたって聞いたけど？\n女：うん、最初は先生に書くよう求められて、毎日起こった面白いことを書いていたら、だんだん習慣になったの。\n男：日記を書くことにどんな良いことがあると思う？\n女：私に美しい思い出を残してくれるの。\n問：最初は誰が彼女に日記を書くよう求めたか。",transcriptPinyin:"男：Tīngshuō nǐ cóngxiǎo jiù kāishǐ xiě rìjì le?\n女：Shì, kāishǐ shì lǎoshī yāoqiú xiě, xiě měitiān fāshēng de yǒu yìsi de shì, mànmàn jiù chéng xíguàn le.\n男：Nǐ juéde xiě rìjì yǒu shénme hǎochù?\n女：Kěyǐ gěi wǒ liúxià yìxiē měihǎo de huíyì."},
    {id:"l-41007-32",transcript:"女：动作快一点儿，快来不及了。\n男：什么来不及了，你拉我去哪里？\n女：出发时间改下午两点了，现在就集合。\n男：怎么没通知我们啊？\n问：女的为什么着急？",question:"女的为什么着急？",options:["变胖了","要考试了","游泳输了","时间提前了"],answer:3,transcriptJa:"女：もっと急いで、間に合わなくなるよ。\n男：何が間に合わないの、僕をどこに連れて行くの？\n女：出発時間が午後2時に変更になったの、今すぐ集合だよ。\n男：どうして僕たちに知らせてくれなかったの？\n問：女性はなぜ焦っているか。",transcriptPinyin:"女：Dòngzuò kuài yìdiǎnr, kuài láibují le.\n男：Shénme láibují le, nǐ lā wǒ qù nǎlǐ?\n女：Chūfā shíjiān gǎi xiàwǔ liǎng diǎn le, xiànzài jiù jíhé.\n男：Zěnme méi tōngzhī wǒmen a?"},
    {id:"l-41007-33",transcript:"男：你们俩真的是姐妹呀？\n女：对，不像吗？\n男：细看的话，鼻子和眼睛确实挺像的。\n女：别人也都这么说，不过我妹性格比我活泼。\n问：关于她妹妹，可以知道什么？",question:"关于她妹妹，可以知道什么？",options:["爱吃鱼","是大学生","性格活泼","喜欢上网"],answer:2,transcriptJa:"男：あなたたち二人は本当に姉妹なの？\n女：うん、似てない？\n男：よく見ると、鼻と目は確かにかなり似てるね。\n女：他の人もみんなそう言うよ、でも妹は私より性格が活発なの。\n問：彼女の妹について何が分かるか。",transcriptPinyin:"男：Nǐmen liǎ zhēn de shì jiěmèi ya?\n女：Duì, bú xiàng ma?\n男：Xì kàn dehuà, bízi hé yǎnjing quèshí tǐng xiàng de.\n女：Biéren yě dōu zhème shuō, búguò wǒ mèi xìnggé bǐ wǒ huópō."},
    {id:"l-41007-34",transcript:"女：周老师，没想到在这儿遇到您！您去哪儿？\n男：去北京参加一个教育工作会，你呢？\n女：我也回北京，我弟弟要结婚。您是十点零五的飞机吗？\n男：对。我刚听广播里说，飞机要推迟半小时起飞。\n问：周老师去北京做什么？",question:"周老师去北京做什么？",options:["开会","办签证","看同事","看京剧表演"],answer:0,transcriptJa:"女：周先生、ここでお会いするとは思いませんでした！どちらへ行かれるんですか？\n男：北京へ教育関係の会議に参加しに行きます、あなたは？\n女：私も北京に戻ります、弟が結婚するんです。先生は10時5分の飛行機ですか？\n男：そうです。さっき放送で、飛行機が30分遅れて出発すると聞きました。\n問：周先生は北京へ何をしに行くか。",transcriptPinyin:"女：Zhōu lǎoshī, méi xiǎngdào zài zhèr yùdào nín! Nín qù nǎr?\n男：Qù Běijīng cānjiā yí ge jiàoyù gōngzuòhuì, nǐ ne?\n女：Wǒ yě huí Běijīng, wǒ dìdi yào jiéhūn. Nín shì shí diǎn líng wǔ de fēijī ma?\n男：Duì. Wǒ gāng tīng guǎngbō lǐ shuō, fēijī yào tuīchí bàn xiǎoshí qǐfēi."},
    {id:"l-41007-35",transcript:"男：你好，我想报名参加这个月的普通话水平考试。\n女：对不起，报名工作今天上午刚结束。\n男：啊，那下一次考试是什么时候？\n女：八月十五号，报名时间您可以上我们的网站查一下。\n问：下一次考试是几月？",question:"下一次考试是几月？",options:["4月","5月","8月","10月"],answer:2,transcriptJa:"男：こんにちは、今月の普通話水平試験に申し込みたいのですが。\n女：申し訳ございません、申し込み受付は今日の午前中に終わったばかりです。\n男：ああ、では次回の試験はいつですか？\n女：8月15日です、申し込み期間は当ウェブサイトでご確認いただけます。\n問：次回の試験は何月か。",transcriptPinyin:"男：Nǐ hǎo, wǒ xiǎng bàomíng cānjiā zhège yuè de pǔtōnghuà shuǐpíng kǎoshì.\n女：Duìbuqǐ, bàomíng gōngzuò jīntiān shàngwǔ gāng jiéshù.\n男：À, nà xià yí cì kǎoshì shì shénme shíhou?\n女：Bā yuè shíwǔ hào, bàomíng shíjiān nín kěyǐ shàng wǒmen de wǎngzhàn chá yíxià."},
    {id:"l-41007-36",transcript:"我爸和我妈是大学同学，现在我又在他们那个学校里读博士。可以说，我和他们既是儿子和父母的关系，又是同学关系。我常和我爸爸开玩笑，叫他“老同学”。",question:"说话人现在在学校做什么？",options:["读硕士","读博士","当教授","当校长"],answer:1,transcriptJa:"父と母は大学の同級生で、今私も彼らと同じ学校で博士課程を学んでいる。私と両親は、息子と親という関係であると同時に、同級生という関係でもあると言える。私はよく父に冗談を言って、彼を「先輩同級生」と呼んでいる。",transcriptPinyin:"Wǒ bà hé wǒ mā shì dàxué tóngxué, xiànzài wǒ yòu zài tāmen nàge xuéxiào lǐ dú bóshì. Kěyǐ shuō, wǒ hé tāmen jì shì érzi hé fùmǔ de guānxi, yòu shì tóngxué guānxi. Wǒ cháng hé wǒ bàba kāiwánxiào, jiào tā \"lǎo tóngxué\"."},
    {id:"l-41007-37",transcript:"我爸和我妈是大学同学，现在我又在他们那个学校里读博士。可以说，我和他们既是儿子和父母的关系，又是同学关系。我常和我爸爸开玩笑，叫他“老同学”。",question:"关于说话人，可以知道什么？",options:["个子矮","会弹钢琴","和父母同校","专业是中文"],answer:2,transcriptJa:"父と母は大学の同級生で、今私も彼らと同じ学校で博士課程を学んでいる。私と両親は、息子と親という関係であると同時に、同級生という関係でもあると言える。私はよく父に冗談を言って、彼を「先輩同級生」と呼んでいる。",transcriptPinyin:"Wǒ bà hé wǒ mā shì dàxué tóngxué, xiànzài wǒ yòu zài tāmen nàge xuéxiào lǐ dú bóshì. Kěyǐ shuō, wǒ hé tāmen jì shì érzi hé fùmǔ de guānxi, yòu shì tóngxué guānxi. Wǒ cháng hé wǒ bàba kāiwánxiào, jiào tā \"lǎo tóngxué\"."},
    {id:"l-41007-38",transcript:"学习一种语言不是简单的事情，许多人在开始学的时候觉得很困难，于是就放弃了。但是只要坚持下来，从最基础的东西学起，慢慢就会发现自己的变化。这时候就会增加我们的信心，离学好这种语言也就越来越近了。",question:"很多人开始学习一种语言时会觉得怎么样？",options:["很害怕","很困难","非常得意","十分有趣"],answer:1,transcriptJa:"言語を学ぶことは簡単なことではない。多くの人は学び始めたときに難しいと感じ、そのため諦めてしまう。しかし、続けさえすれば、最も基礎的なことから学び始めて、徐々に自分の変化に気づくようになる。そのとき私たちの自信は増し、その言語をマスターすることにますます近づいていくのだ。",transcriptPinyin:"Xuéxí yì zhǒng yǔyán bú shì jiǎndān de shìqing, xǔduō rén zài kāishǐ xué de shíhou juéde hěn kùnnan, yúshì jiù fàngqì le. Dànshì zhǐyào jiānchí xiàlái, cóng zuì jīchǔ de dōngxi xuéqǐ, mànmàn jiù huì fāxiàn zìjǐ de biànhuà. Zhè shíhou jiù huì zēngjiā wǒmen de xìnxīn, lí xuéhǎo zhè zhǒng yǔyán yě jiù yuèláiyuè jìn le."},
    {id:"l-41007-39",transcript:"学习一种语言不是简单的事情，许多人在开始学的时候觉得很困难，于是就放弃了。但是只要坚持下来，从最基础的东西学起，慢慢就会发现自己的变化。这时候就会增加我们的信心，离学好这种语言也就越来越近了。",question:"怎样才能学好一种语言？",options:["要坚持","去留学","多练习","要特别仔细"],answer:0,transcriptJa:"言語を学ぶことは簡単なことではない。多くの人は学び始めたときに難しいと感じ、そのため諦めてしまう。しかし、続けさえすれば、最も基礎的なことから学び始めて、徐々に自分の変化に気づくようになる。そのとき私たちの自信は増し、その言語をマスターすることにますます近づいていくのだ。",transcriptPinyin:"Xuéxí yì zhǒng yǔyán bú shì jiǎndān de shìqing, xǔduō rén zài kāishǐ xué de shíhou juéde hěn kùnnan, yúshì jiù fàngqì le. Dànshì zhǐyào jiānchí xiàlái, cóng zuì jīchǔ de dōngxi xuéqǐ, mànmàn jiù huì fāxiàn zìjǐ de biànhuà. Zhè shíhou jiù huì zēngjiā wǒmen de xìnxīn, lí xuéhǎo zhè zhǒng yǔyán yě jiù yuèláiyuè jìn le."},
    {id:"l-41007-40",transcript:"真正的爱情可以使两个人相互理解、信任和尊重，使我们的生活变得更精彩。无论穷还是富，真正的爱情会让人觉得不孤单，仅仅一个笑脸、一句关心的话，就会让人感觉非常幸福。",question:"爱情可以让生活变得怎么样？",options:["精彩","复杂","可惜","安全"],answer:0,transcriptJa:"本当の愛は二人が互いに理解し、信頼し、尊重し合うことを可能にし、私たちの生活をより素晴らしいものにしてくれる。貧しくても豊かでも、本当の愛は人に孤独を感じさせない。ただ一つの笑顔、一言の気遣う言葉だけで、人はとても幸せを感じることができるのだ。",transcriptPinyin:"Zhēnzhèng de àiqíng kěyǐ shǐ liǎng ge rén xiānghù lǐjiě, xìnrèn hé zūnzhòng, shǐ wǒmen de shēnghuó biàn de gèng jīngcǎi. Wúlùn qióng háishi fù, zhēnzhèng de àiqíng huì ràng rén juéde bù gūdān, jǐnjǐn yí ge xiàoliǎn, yí jù guānxīn de huà, jiù huì ràng rén gǎnjué fēicháng xìngfú."},
    {id:"l-41007-41",transcript:"真正的爱情可以使两个人相互理解、信任和尊重，使我们的生活变得更精彩。无论穷还是富，真正的爱情会让人觉得不孤单，仅仅一个笑脸、一句关心的话，就会让人感觉非常幸福。",question:"这段话主要谈什么？",options:["什么是信任","什么是幸福","爱情的作用","怎样尊重别人"],answer:2,transcriptJa:"本当の愛は二人が互いに理解し、信頼し、尊重し合うことを可能にし、私たちの生活をより素晴らしいものにしてくれる。貧しくても豊かでも、本当の愛は人に孤独を感じさせない。ただ一つの笑顔、一言の気遣う言葉だけで、人はとても幸せを感じることができるのだ。",transcriptPinyin:"Zhēnzhèng de àiqíng kěyǐ shǐ liǎng ge rén xiānghù lǐjiě, xìnrèn hé zūnzhòng, shǐ wǒmen de shēnghuó biàn de gèng jīngcǎi. Wúlùn qióng háishi fù, zhēnzhèng de àiqíng huì ràng rén juéde bù gūdān, jǐnjǐn yí ge xiàoliǎn, yí jù guānxīn de huà, jiù huì ràng rén gǎnjué fēicháng xìngfú."},
    {id:"l-41007-42",transcript:"有人说时间就是金钱，我认为时间更像生命，钱花完了可以再赚，但是时间过去了就再也找不回来。时间不会为任何人、任何事停下脚步。每个人都不应该浪费时间，因为浪费时间也就是浪费生命。",question:"说话人认为时间更像什么？",options:["金钱","阳光","生命","风景"],answer:2,transcriptJa:"時間は金なりと言う人がいるが、私は時間はむしろ命に似ていると思う。お金は使い果たしてもまた稼ぐことができるが、時間は過ぎてしまえばもう二度と取り戻せない。時間は誰のためにも、どんな事のためにも足を止めることはない。誰もが時間を無駄にすべきではない。なぜなら、時間を無駄にすることは命を無駄にすることでもあるからだ。",transcriptPinyin:"Yǒu rén shuō shíjiān jiùshì jīnqián, wǒ rènwéi shíjiān gèng xiàng shēngmìng, qián huāwán le kěyǐ zài zhuàn, dànshì shíjiān guòqù le jiù zài yě zhǎo bù huílái. Shíjiān bú huì wèi rènhé rén, rènhé shì tíngxià jiǎobù. Měi ge rén dōu bù yīnggāi làngfèi shíjiān, yīnwèi làngfèi shíjiān yě jiùshì làngfèi shēngmìng."},
    {id:"l-41007-43",transcript:"有人说时间就是金钱，我认为时间更像生命，钱花完了可以再赚，但是时间过去了就再也找不回来。时间不会为任何人、任何事停下脚步。每个人都不应该浪费时间，因为浪费时间也就是浪费生命。",question:"这段话主要想告诉我们什么？",options:["不要骄傲","要积累经验","要节约用水","别浪费时间"],answer:3,transcriptJa:"時間は金なりと言う人がいるが、私は時間はむしろ命に似ていると思う。お金は使い果たしてもまた稼ぐことができるが、時間は過ぎてしまえばもう二度と取り戻せない。時間は誰のためにも、どんな事のためにも足を止めることはない。誰もが時間を無駄にすべきではない。なぜなら、時間を無駄にすることは命を無駄にすることでもあるからだ。",transcriptPinyin:"Yǒu rén shuō shíjiān jiùshì jīnqián, wǒ rènwéi shíjiān gèng xiàng shēngmìng, qián huāwán le kěyǐ zài zhuàn, dànshì shíjiān guòqù le jiù zài yě zhǎo bù huílái. Shíjiān bú huì wèi rènhé rén, rènhé shì tíngxià jiǎobù. Měi ge rén dōu bù yīnggāi làngfèi shíjiān, yīnwèi làngfèi shíjiān yě jiùshì làngfèi shēngmìng."},
    {id:"l-41007-44",transcript:"我不同意提高门票价格。门票价格提高后，门票收入好像会增加，可是来这儿的游客却有可能因此而减少，实际上总的收入在减少。所以我觉得应该降低门票价格，以吸引更多的人来这儿。",question:"说话人对提高门票价格是什么态度？",options:["支持","反对","后悔","同情"],answer:1,transcriptJa:"私は入場料の値上げに同意しません。入場料を値上げすると、入場券の収入は増えるように見えますが、ここに来る観光客はそれによって減少する可能性があり、実際には総収入は減少しています。ですから、より多くの人をここに呼び込むために、入場料を引き下げるべきだと思います。",transcriptPinyin:"Wǒ bù tóngyì tígāo ménpiào jiàgé. Ménpiào jiàgé tígāo hòu, ménpiào shōurù hǎoxiàng huì zēngjiā, kěshì lái zhèr de yóukè què yǒu kěnéng yīncǐ ér jiǎnshǎo, shíjìshang zǒng de shōurù zài jiǎnshǎo. Suǒyǐ wǒ juéde yīnggāi jiàngdī ménpiào jiàgé, yǐ xīyǐn gèng duō de rén lái zhèr."},
    {id:"l-41007-45",transcript:"我不同意提高门票价格。门票价格提高后，门票收入好像会增加，可是来这儿的游客却有可能因此而减少，实际上总的收入在减少。所以我觉得应该降低门票价格，以吸引更多的人来这儿。",question:"说话人最可能在哪儿工作？",options:["图书馆","大使馆","电影院","动物园"],answer:3,transcriptJa:"私は入場料の値上げに同意しません。入場料を値上げすると、入場券の収入は増えるように見えますが、ここに来る観光客はそれによって減少する可能性があり、実際には総収入は減少しています。ですから、より多くの人をここに呼び込むために、入場料を引き下げるべきだと思います。",transcriptPinyin:"Wǒ bù tóngyì tígāo ménpiào jiàgé. Ménpiào jiàgé tígāo hòu, ménpiào shōurù hǎoxiàng huì zēngjiā, kěshì lái zhèr de yóukè què yǒu kěnéng yīncǐ ér jiǎnshǎo, shíjìshang zǒng de shōurù zài jiǎnshǎo. Suǒyǐ wǒ juéde yīnggāi jiàngdī ménpiào jiàgé, yǐ xīyǐn gèng duō de rén lái zhèr."}

  // ---- state ----
  var STORE_KEY = "hsk4-daily-app-v1";
  var INTERVALS = [1, 2, 4, 7, 14]; // days, indexed by box

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function addDays(dateStr, n) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function isPastOrToday(dateStr) {
    var t = todayStr().split("-").map(Number);
    var d = dateStr.split("-").map(Number);
    var td = new Date(t[0], t[1]-1, t[2]).getTime();
    var dd = new Date(d[0], d[1]-1, d[2]).getTime();
    return dd <= td;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { items: {}, streak: { last: null, count: 0 } };
  }
  function saveState() {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }
  function getItemState(id) {
    if (!state.items[id]) {
      state.items[id] = { box: 0, nextDue: todayStr(), needsReview: false, wrongCount: 0, seen: 0 };
    }
    return state.items[id];
  }

  var state = loadState();

  function bumpStreak() {
    var t = todayStr();
    if (state.streak.last === t) return;
    if (state.streak.last === addDays(t, -1)) {
      state.streak.count += 1;
    } else {
      state.streak.count = 1;
    }
    state.streak.last = t;
    saveState();
  }

  // ---- queues ----
  function dueQueue(pool) {
    var due = [];
    var fresh = [];
    pool.forEach(function (it) {
      var s = getItemState(it.id);
      if (s.seen === 0) fresh.push(it);
      else if (isPastOrToday(s.nextDue)) due.push(it);
    });
    due.sort(function (a, b) {
      return getItemState(a.id).needsReview === getItemState(b.id).needsReview ? 0 : (getItemState(a.id).needsReview ? -1 : 1);
    });
    var queue = due.concat(fresh);
    return queue.slice(0, 20);
  }
  function reviewQueue() {
    var all = VOCAB.concat(LISTENING);
    return all.filter(function (it) {
      return getItemState(it.id).needsReview;
    });
  }

  function counts() {
    return {
      vocabDue: dueQueue(VOCAB).length,
      listenDue: dueQueue(LISTENING).length,
      review: reviewQueue().length,
      mastered: VOCAB.concat(LISTENING).filter(function (it) { return getItemState(it.id).box >= 4; }).length
    };
  }

  function renderHome() {
    var c = counts();
    document.getElementById("streakNum").textContent = state.streak.count || 0;
    document.getElementById("statDue").textContent = c.vocabDue + c.listenDue;
    document.getElementById("statReview").textContent = c.review;
    document.getElementById("statMastered").textContent = c.mastered;
    document.getElementById("badgeVocab").textContent = c.vocabDue;
    document.getElementById("badgeListening").textContent = c.listenDue;
    document.getElementById("badgeReview").textContent = c.review;
  }

  // ---- session engine ----
  var session = null; // { type, queue, index, correct }

  function goHome() {
    stopAllAudio();
    document.getElementById("sessionView").classList.remove("active");
    document.getElementById("browseView").classList.remove("active");
    document.getElementById("homeView").classList.remove("hidden");
    document.getElementById("doneView").classList.remove("show");
    renderHome();
  }

  function sessionBack() {
    if (session && session.browsing) {
      stopAllAudio();
      document.getElementById("sessionView").classList.remove("active");
      document.getElementById("browseView").classList.add("active");
      return;
    }
    goHome();
  }

  function openBrowse() {
    document.getElementById("homeView").classList.add("hidden");
    document.getElementById("browseView").classList.add("active");
    renderBrowsePanels();
    setBrowseTab("vocab");
  }

  function setBrowseTab(tab) {
    document.getElementById("tabVocab").classList.toggle("active", tab === "vocab");
    document.getElementById("tabListening").classList.toggle("active", tab === "listening");
    document.getElementById("browseVocabPanel").hidden = tab !== "vocab";
    document.getElementById("browseListenPanel").hidden = tab !== "listening";
  }

  function renderBrowsePanels() {
    var vp = document.getElementById("browseVocabPanel");
    vp.innerHTML = '<div class="browse-vocab-grid">' + VOCAB.map(function (v) {
      return '<button class="browse-num-btn" onclick="openBrowseItem(\'vocab\',\'' + v.id + '\')">' + v.id.replace("v", "") + '</button>';
    }).join('') + '</div>';

    var sets = {};
    LISTENING.forEach(function (it) {
      var m = it.id.match(/^l-(\d+)-(\d+)$/);
      if (!sets[m[1]]) sets[m[1]] = [];
      sets[m[1]].push({ num: Number(m[2]), id: it.id });
    });
    var lp = document.getElementById("browseListenPanel");
    lp.innerHTML = Object.keys(sets).sort().map(function (setId) {
      var items = sets[setId].sort(function (a, b) { return a.num - b.num; });
      var grid = items.map(function (it) {
        return '<button class="browse-num-btn" onclick="openBrowseItem(\'listening\',\'' + it.id + '\')">' + it.num + '</button>';
      }).join('');
      return '<details class="browse-set"><summary>HSK4 ' + setId + '（45問）</summary><div class="browse-grid">' + grid + '</div></details>';
    }).join('');
  }

  function openBrowseItem(kind, id) {
    var it = (kind === "vocab" ? VOCAB : LISTENING).find(function (x) { return x.id === id; });
    if (!it) return;
    session = { queue: [it], index: 0, correct: 0, kind: kind, browsing: true };
    document.getElementById("browseView").classList.remove("active");
    document.getElementById("sessionView").classList.add("active");
    document.getElementById("doneView").classList.remove("show");
    renderStep();
  }

  function startSession(type) {
    var queue;
    var kind;
    if (type === "vocab") { queue = dueQueue(VOCAB); kind = "vocab"; }
    else if (type === "listening") { queue = dueQueue(LISTENING); kind = "listening"; }
    else { queue = reviewQueue(); kind = "mixed"; }

    session = { queue: queue, index: 0, correct: 0, kind: kind };
    document.getElementById("homeView").classList.add("hidden");
    document.getElementById("sessionView").classList.add("active");
    document.getElementById("doneView").classList.remove("show");
    renderStep();
  }

  function itemKind(it) {
    return it.hanzi ? "vocab" : "listening";
  }

  function itemLabel(id) {
    var m = id.match(/^l-(\d+)-(\d+)$/);
    if (m) return m[1] + " · Q" + Number(m[2]);
    return id;
  }

  function renderStep() {
    stopAllAudio();
    var body = document.getElementById("sessionBody");
    var total = session.queue.length;
    var i = session.index;

    document.getElementById("progressTrack").style.visibility = session.browsing ? "hidden" : "visible";
    if (session.browsing) {
      document.getElementById("progressCount").textContent = "プレビュー（進捗には反映されません）";
    } else {
      document.getElementById("progressCount").textContent = Math.min(i, total) + "/" + total;
    }
    document.getElementById("progressFill").style.width = (total ? (i / total * 100) : 0) + "%";

    if (total === 0) {
      body.innerHTML = "";
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = "<div style='font-size:32px;'>🎉</div><div>今はここに予定がありません。<br>他のモードを試してみてください。</div>";
      body.appendChild(empty);
      return;
    }

    if (i >= total) {
      body.innerHTML = "";
      document.getElementById("doneMsg").textContent = "今回は " + total + " 問中 " + session.correct + " 問正解でした。";
      document.getElementById("doneView").classList.add("show");
      bumpStreak();
      return;
    }

    var it = session.queue[i];
    if (itemKind(it) === "vocab") renderVocabCard(body, it);
    else renderListeningCard(body, it);
  }

  var WRONG_REASONS = ["発音", "意味", "使い方", "その他"];

  function grade(it, correct, reason) {
    var s = getItemState(it.id);
    s.seen += 1;
    if (correct) {
      s.box = Math.min(s.box + 1, 4);
      if (s.needsReview) s.needsReview = false;
      s.nextDue = addDays(todayStr(), INTERVALS[s.box]);
      session.correct += 1;
    } else {
      s.box = 0;
      s.needsReview = true;
      s.wrongCount += 1;
      s.nextDue = addDays(todayStr(), 1);
      if (reason) {
        if (!s.reasonCounts) s.reasonCounts = {};
        s.reasonCounts[reason] = (s.reasonCounts[reason] || 0) + 1;
      }
    }
    saveState();
    session.index += 1;
    renderStep();
  }

  function renderVocabCard(body, it) {
    var exampleHtml = it.example
      ? '<div class="example-block">' +
          '<div class="ex-row">' +
            '<div class="ex-zh">' + it.example.zh + '</div>' +
            '<button class="mini-play-btn small" id="examplePlayBtn" aria-label="例文の発音を再生">▶</button>' +
          '</div>' +
          '<div class="ex-pinyin">' + it.example.pinyin + '</div>' +
          '<div>' + it.example.ja + '</div>' +
          (it.example.en ? '<div class="en-line">' + it.example.en + '</div>' : '') +
        '</div>'
      : '';

    body.innerHTML =
      '<div class="card" id="flipCard" tabindex="0" role="button" aria-label="タップして答えを見る">' +
        '<div class="item-tag">' + itemLabel(it.id) + '</div>' +
        '<div class="hanzi-row">' +
          '<div class="hanzi">' + it.hanzi + '</div>' +
          '<button class="mini-play-btn" id="vocabPlayBtn" aria-label="発音を再生">▶</button>' +
        '</div>' +
        '<div class="reveal-hint" id="revealHint">タップして意味を見る</div>' +
        '<div class="answer-block" id="answerBlock">' +
          '<div class="pinyin">' + it.pinyin + '</div>' +
          '<div class="meaning">' + it.meaning + (it.meaningEn ? '<span class="en-line">' + it.meaningEn + '</span>' : '') + '</div>' +
          exampleHtml +
        '</div>' +
      '</div>' +
      (session.browsing
        ? '<button class="next-btn show" id="browseCloseBtn">問題一覧に戻る</button>'
        : '<div class="grade-row" id="gradeRow">' +
            '<button class="grade-btn wrong" id="btnWrong">わからなかった</button>' +
            '<button class="grade-btn right" id="btnRight">わかった</button>' +
          '</div>' +
          '<div class="reason-row" id="reasonRow">' +
            WRONG_REASONS.map(function (r) { return '<button class="reason-chip" data-reason="' + r + '">' + r + '</button>'; }).join('') +
          '</div>');

    document.getElementById("vocabPlayBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      if (this.classList.contains("playing")) { stopAllAudio(); return; }
      speak(it.hanzi, this);
    });
    if (it.example) {
      document.getElementById("examplePlayBtn").addEventListener("click", function (e) {
        e.stopPropagation();
        if (this.classList.contains("playing")) { stopAllAudio(); return; }
        speak(it.example.zh, this);
      });
    }

    var revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      document.getElementById("answerBlock").classList.add("show");
      document.getElementById("revealHint").style.display = "none";
      if (!session.browsing) {
        document.getElementById("btnWrong").classList.add("show");
        document.getElementById("btnRight").classList.add("show");
      }
    }
    var card = document.getElementById("flipCard");
    card.addEventListener("click", reveal);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
    });

    if (session.browsing) {
      document.getElementById("browseCloseBtn").addEventListener("click", sessionBack);
    } else {
      document.getElementById("btnWrong").addEventListener("click", function () {
        document.getElementById("gradeRow").style.display = "none";
        document.getElementById("reasonRow").classList.add("show");
      });
      document.getElementById("btnRight").addEventListener("click", function () { grade(it, true); });
      document.getElementById("reasonRow").addEventListener("click", function (e) {
        var btn = e.target.closest(".reason-chip");
        if (!btn) return;
        grade(it, false, btn.getAttribute("data-reason"));
      });
    }
  }

  var currentAudio = null;
  var activePlayBtn = null;

  function setBtnPlaying(btn, playing) {
    if (!btn) return;
    if (!btn.dataset.icon) btn.dataset.icon = btn.textContent;
    if (playing) {
      if (activePlayBtn && activePlayBtn !== btn) {
        activePlayBtn.textContent = activePlayBtn.dataset.icon;
        activePlayBtn.classList.remove("playing");
      }
      activePlayBtn = btn;
      btn.textContent = "■";
      btn.classList.add("playing");
    } else {
      btn.textContent = btn.dataset.icon;
      btn.classList.remove("playing");
      if (activePlayBtn === btn) activePlayBtn = null;
    }
  }

  function stopAllAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (activePlayBtn) setBtnPlaying(activePlayBtn, false);
  }

  var zhVoice = null;
  function pickZhVoice() {
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    var zh = voices.filter(function (v) { return /^zh/i.test(v.lang); });
    if (!zh.length) return null;
    var premium = zh.find(function (v) { return /google|premium|enhanced|natural|neural/i.test(v.name); });
    if (premium) return premium;
    var nonCompact = zh.find(function (v) { return !/compact/i.test(v.name); });
    return nonCompact || zh[0];
  }
  if ("speechSynthesis" in window) {
    zhVoice = pickZhVoice();
    window.speechSynthesis.onvoiceschanged = function () { zhVoice = pickZhVoice(); };
  }

  function speak(text, btn) {
    stopAllAudio();
    setBtnPlaying(btn, true);
    if (!("speechSynthesis" in window)) { setBtnPlaying(btn, false); return; }
    if (!zhVoice) zhVoice = pickZhVoice();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.9;
    u.onend = function () { setBtnPlaying(btn, false); };
    u.onerror = function () { setBtnPlaying(btn, false); };
    window.speechSynthesis.speak(u);
  }

  function playListening(it, btn) {
    stopAllAudio();
    setBtnPlaying(btn, true);
    var audio = new Audio("audio/" + it.id + ".mp3");
    currentAudio = audio;
    audio.addEventListener("ended", function () { setBtnPlaying(btn, false); });
    var fellBack = false;
    audio.addEventListener("error", function () {
      if (fellBack) return;
      fellBack = true;
      currentAudio = null;
      speak(it.transcript, btn);
    });
    audio.play().catch(function () {
      if (fellBack) return;
      fellBack = true;
      currentAudio = null;
      speak(it.transcript, btn);
    });
  }

  function renderListeningCard(body, it) {
    var optionsHtml = it.options.map(function (opt, idx) {
      return '<button class="option-btn" data-idx="' + idx + '">' + opt + '</button>';
    }).join("");

    body.innerHTML =
      '<div class="listen-card">' +
        '<div class="item-tag">' + itemLabel(it.id) + '</div>' +
        '<button class="play-btn" id="playBtn" aria-label="音声を再生">▶</button>' +
        '<div class="listen-hint">タップして音声を聞く（再生中はタップで停止）</div>' +
        '<div class="question-text">' + it.question + '</div>' +
        '<div class="options" id="optionsWrap">' + optionsHtml + '</div>' +
        '<div class="transcript" id="transcript">スクリプト：' + it.transcript +
          (it.transcriptPinyin ? '<span class="pinyin-line">' + it.transcriptPinyin + '</span>' : '') +
          (it.transcriptJa ? '<span class="ja">訳：' + it.transcriptJa + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<button class="next-btn" id="nextBtn">' + (session.browsing ? '問題一覧に戻る' : '次へ') + '</button>';

    document.getElementById("playBtn").addEventListener("click", function () {
      if (this.classList.contains("playing")) { stopAllAudio(); return; }
      playListening(it, this);
    });

    var answered = false;
    var buttons = body.querySelectorAll(".option-btn");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (answered) return;
        answered = true;
        var idx = Number(btn.getAttribute("data-idx"));
        var isCorrect = idx === it.answer;
        buttons.forEach(function (b, bi) {
          b.disabled = true;
          if (bi === it.answer) b.classList.add("correct");
          else if (bi === idx && !isCorrect) b.classList.add("incorrect");
        });
        document.getElementById("transcript").classList.add("show");
        document.getElementById("nextBtn").classList.add("show");
        document.getElementById("nextBtn").addEventListener("click", function handler() {
          if (session.browsing) sessionBack();
          else grade(it, isCorrect);
        }, { once: true });
      });
    });
  }

  window.startSession = startSession;
  window.goHome = goHome;
  window.sessionBack = sessionBack;
  window.openBrowse = openBrowse;
  window.setBrowseTab = setBrowseTab;
  window.openBrowseItem = openBrowseItem;

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("これまでの学習進捗（連続日数・習得状況）をすべて消去します。よろしいですか？")) return;
    localStorage.removeItem(STORE_KEY);
    state = loadState();
    renderHome();
  });

  // ---- 選択した中国語をその場で辞書検索 ----
  var lookupPopup = document.getElementById("lookupPopup");
  var lookupBtn = document.getElementById("lookupBtn");
  var lookupTimer = null;

  document.addEventListener("selectionchange", function () {
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(updateLookupPopup, 150);
  });

  function updateLookupPopup() {
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    var sessionBody = document.getElementById("sessionBody");
    if (!text || text.length > 15 || !sel.rangeCount || !sessionBody) {
      lookupPopup.hidden = true;
      return;
    }
    var range = sel.getRangeAt(0);
    if (!sessionBody.contains(range.commonAncestorContainer)) {
      lookupPopup.hidden = true;
      return;
    }
    var rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) { lookupPopup.hidden = true; return; }
    lookupBtn.textContent = "「" + text + "」を調べる";
    lookupPopup.style.left = (rect.left + rect.width / 2) + "px";
    lookupPopup.style.top = (rect.top - 10) + "px";
    lookupPopup.hidden = false;
  }

  lookupBtn.addEventListener("click", function () {
    var text = window.getSelection().toString().trim();
    if (text) window.open("https://cjjc.weblio.jp/content/" + encodeURIComponent(text), "_blank", "noopener");
    lookupPopup.hidden = true;
    window.getSelection().removeAllRanges();
  });

  document.addEventListener("scroll", function () { lookupPopup.hidden = true; }, true);

  renderHome();
})();
</script>
